<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fortuna — экономика</title>
<meta property="og:type" content="website" />
<meta property="og:site_name" content="xFORTUNAx" />
<meta property="og:title" content="Мини-игры сообщества xFORTUNAx" />
<meta property="og:description" content="Присоединяйся к мини-играм сообщества xFORTUNAx!" />
<meta property="og:image" content="https://fortunawtm.com/fortuna-bot-web/img/og-logo.jpg" />
<meta property="og:url" content="https://fortunawtm.com/fortuna-bot-web/app.html" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Мини-игры сообщества xFORTUNAx" />
<meta name="twitter:description" content="Присоединяйся к мини-играм сообщества xFORTUNAx!" />
<meta name="twitter:image" content="https://fortunawtm.com/fortuna-bot-web/img/og-logo.jpg" />
<style>
  :root {
    --bg: #f5f2ec; --surface: #fbf9f5; --surface-2: #f0ece3; --border: #e4ddd0;
    --text: #2a2722; --text-soft: #6b655c; --accent: #c8643c; --accent-soft: #f3e3da;
    --ok: #4a7c4e; --ok-bg: #e6f0e6; --err: #b5432f; --err-bg: #fbe8e4;
    --btn: #2a2722; --btn-text: #fbf9f5;
    --shadow: 0 1px 3px rgba(60,50,35,.06), 0 6px 20px rgba(60,50,35,.05);
    --radius: 16px; --radius-sm: 10px;
  }
  [data-theme="dark"] {
    --bg: #1f1d1a; --surface: #2a2723; --surface-2: #333029; --border: #3d3933;
    --text: #ece7df; --text-soft: #a39c8f; --accent: #e08252; --accent-soft: #3a2c23;
    --ok: #7fc283; --ok-bg: #253a26; --err: #e08a7a; --err-bg: #3a2621;
    --btn: #ece7df; --btn-text: #1f1d1a;
    --shadow: 0 1px 3px rgba(0,0,0,.25), 0 6px 20px rgba(0,0,0,.3);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1f1d1a; --surface: #2a2723; --surface-2: #333029; --border: #3d3933;
      --text: #ece7df; --text-soft: #a39c8f; --accent: #e08252; --accent-soft: #3a2c23;
      --ok: #7fc283; --ok-bg: #253a26; --err: #e08a7a; --err-bg: #3a2621;
      --btn: #ece7df; --btn-text: #1f1d1a;
      --shadow: 0 1px 3px rgba(0,0,0,.25), 0 6px 20px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 90px; }
  h1.hero { font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 18px; color: var(--text); display: flex; align-items: center; justify-content: center; gap: 8px; }

  .auth-card, .stats-grid, .actions-grid, .migrate-box, .result-box, .loading {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .auth-card { padding: 20px; }
  .tabs { display: flex; gap: 6px; background: var(--surface-2); border-radius: var(--radius-sm); padding: 4px; margin-bottom: 16px; }
  .tab { flex: 1; padding: 8px; border: none; background: none; cursor: pointer; font-family: inherit;
    font-size: 14px; font-weight: 600; color: var(--text-soft); border-radius: 7px; }
  .tab.active { background: var(--surface); color: var(--text); }
  .auth-form { display: flex; flex-direction: column; gap: 10px; }
  input {
    font-family: inherit; font-size: 15px; padding: 11px 13px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  .btn-primary, .btn-secondary {
    font-family: inherit; font-size: 15px; font-weight: 650; padding: 11px; border: none;
    border-radius: var(--radius-sm); cursor: pointer;
  }
  .btn-primary { background: var(--btn); color: var(--btn-text); }
  .btn-secondary { background: var(--accent); color: #fff; }
  .btn-ghost {
    font-family: inherit; background: none; border: 1px solid var(--border); color: var(--text-soft);
    padding: 6px 12px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13px;
  }
  .error-text { color: var(--err); font-size: 13px; min-height: 16px; }

  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .topbar-group { display: flex; align-items: center; gap: 6px; }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text-soft); cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 16px;
  }
  .icon-btn img, .icon-btn svg { width: 18px; height: 18px; }

  .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 9px; margin-bottom: 14px; }
  .stat { background: var(--surface-2); border-radius: var(--radius-sm); padding: 12px 10px; }
  .stat-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-soft); margin-bottom: 4px; }
  .stat-value { font-size: 16px; font-weight: 680; letter-spacing: -.01em; display: flex; align-items: center; gap: 5px; }
  .stat-value svg { color: var(--accent); }

  .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 9px; margin-bottom: 14px; }
  .action-card {
    background: var(--surface-2); border-radius: var(--radius-sm);
    padding: 16px 14px; cursor: pointer; text-align: left; color: var(--text);
    font-family: inherit; transition: transform .15s, filter .15s;
  }
  .action-card:hover { filter: brightness(0.97); transform: translateY(-1px); }
  .action-title { font-size: 14.5px; font-weight: 650; margin-bottom: 6px; display: flex; align-items: center; gap: 7px; }
  .action-title svg { color: var(--accent); }
  .action-sub { font-size: 11.5px; color: var(--text-soft); }
  .action-cd { font-size: 11.5px; color: var(--accent); margin-top: 3px; display: flex; align-items: center; gap: 4px; }
  .live-cd { display: inline-flex; align-items: center; gap: 4px; }
  .icon-val { display: inline-flex; align-items: center; gap: 4px; vertical-align: middle; line-height: normal; height: 1em; }

  /* ── Нижняя навигация, по образцу fortuna-game/app.html .game-nav ── */
  .game-nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    display: flex; background: var(--surface); border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(0,0,0,.06); padding: 4px 2px calc(4px + env(safe-area-inset-bottom));
    max-width: 480px; margin: 0 auto;
  }
  .nav-tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 7px 2px 6px; border: none; background: none; cursor: pointer; font-family: inherit;
    border-bottom: 2px solid transparent; color: var(--text-soft); transition: color .15s;
  }
  .nav-tab svg { width: 19px; height: 19px; }
  .nav-tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
  .nav-label { font-size: 8px; font-weight: 650; line-height: 1.15; text-align: center; }
  .btn-sm { padding: 7px 14px; font-size: 13px; white-space: nowrap; }

  .shop-list, .containers-grid { display: flex; flex-direction: column; gap: 1px; background: var(--border); margin-bottom: 4px; overflow: hidden; border-radius: var(--radius); }
  .shop-row {
    background: var(--surface); padding: 12px 14px; display: flex; align-items: center;
    justify-content: space-between; gap: 12px;
  }
  .shop-row-main { min-width: 0; }
  .shop-row-name { font-size: 14px; font-weight: 650; margin-bottom: 2px; }
  .shop-row-desc { font-size: 12px; color: var(--text-soft); }
  .shop-row-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
  .shop-row-price { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .shop-row-price s { color: var(--text-soft); font-weight: 400; margin-left: 4px; }
  .badge-owned {
    font-size: 11px; font-weight: 650; color: var(--ok); background: var(--ok-bg);
    padding: 3px 9px; border-radius: 20px;
  }
  .section-label { font-size: 13px; font-weight: 650; color: var(--text-soft); margin: 16px 0 8px; }

  .container-card { background: var(--surface); padding: 14px; position: relative; }
  .container-card-name { font-size: 15px; font-weight: 650; margin-bottom: 2px; display: flex; align-items: center; gap: 7px; padding-right: 30px; }
  .container-card-name svg { color: var(--accent); }
  .container-card-price { font-size: 12px; color: var(--text-soft); margin-bottom: 10px; display: flex; align-items: center; gap: 4px; }
  .container-buy-row { display: flex; gap: 8px; }
  .container-info-btn {
    position: absolute; top: 14px; right: 14px; background: none; border: none; padding: 2px;
    color: var(--text-soft); cursor: pointer; display: flex;
  }
  .container-info-btn svg { width: 17px; height: 17px; }
  .loot-table-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
  .loot-table-row:last-child { border-bottom: none; }
  .loot-table-chance { color: var(--text-soft); font-size: 12px; min-width: 42px; text-align: right; }

  /* ── Активный рейд — тёмная инвертированная карточка, по образцу
     fortuna-game/app.html .battle-hero (сама инвертируется с темой) ── */
  .raid-hero { background: var(--btn); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 14px; }
  .raid-hero-title { font-size: 16px; font-weight: 650; color: var(--btn-text); display: flex; align-items: center; gap: 8px; }
  .raid-hero-title svg { color: var(--accent); }
  .raid-hero-hp { font-size: 12.5px; color: var(--btn-text); opacity: .65; margin: 4px 0 10px; }
  .raid-hero-track { background: rgba(255,255,255,.14); border-radius: 99px; height: 9px; overflow: hidden; margin-bottom: 14px; }
  [data-theme="dark"] .raid-hero-track { background: rgba(0,0,0,.2); }
  .raid-hero-fill { background: var(--accent); height: 100%; border-radius: 99px; transition: width .4s ease; }
  .raid-hero-row { display: flex; gap: 8px; }
  .raid-hero-row .btn-secondary { flex: 1; }

  .feed-list { display: flex; flex-direction: column; gap: 1px; background: var(--border); border-radius: var(--radius); overflow: hidden; }
  .feed-row { background: var(--surface); padding: 11px 14px; }
  .feed-text { font-size: 13.5px; }
  .feed-time { font-size: 11px; color: var(--text-soft); margin-top: 2px; }

  .result-box { padding: 12px 14px; font-size: 14px; margin-bottom: 14px; white-space: pre-line; }
  .result-ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
  .result-err { background: var(--err-bg); color: var(--err); border-color: transparent; }

  .migrate-box { padding: 14px; }
  .migrate-box summary {
    cursor: pointer; font-weight: 600; font-size: 14px; color: var(--text-soft);
    list-style: none; display: flex; align-items: center; gap: 7px;
  }
  .migrate-box summary::-webkit-details-marker { display: none; }
  .migrate-box summary svg { color: var(--accent); flex-shrink: 0; }
  #migrate-form { display: flex; gap: 8px; margin-top: 12px; }
  #migrate-form input { flex: 1; text-transform: uppercase; }

  .loading { padding: 30px; text-align: center; color: var(--text-soft); }

  /* ── Модалка с кратким гайдом (кнопка-инфо в шапке) ── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 100; background: rgba(20,17,12,.5);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay[hidden] { display: none; }
  .modal-box {
    background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
    width: 100%; max-width: 420px; max-height: 80vh; overflow-y: auto; padding: 18px;
  }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .modal-title { font-size: 16px; font-weight: 700; }
  .modal-close {
    background: none; border: none; font-size: 17px; color: var(--text-soft); cursor: pointer;
    padding: 4px 8px; line-height: 1; font-family: inherit;
  }
  .modal-body { display: flex; flex-direction: column; gap: 12px; }
  .guide-item { display: flex; gap: 10px; align-items: flex-start; }
  .guide-item img, .guide-item svg { width: 20px; height: 20px; flex-shrink: 0; margin-top: 1px; color: var(--accent); }
  .guide-item-title { font-size: 13.5px; font-weight: 650; margin-bottom: 2px; }
  .guide-item-desc { font-size: 12.5px; color: var(--text-soft); }

  /* ── Ссылка на профиль в ленте ── */
  .player-link { text-decoration: underline; text-underline-offset: 2px; cursor: pointer; font-weight: 650; color: var(--text); }
  .player-link:hover { color: var(--accent); }

  /* ── Модалка профиля участника ── */
  .profile-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }

  /* ── Дизайны профиля (VIP-косметика от "Игрушечная админка от Максима") ──
     Адаптация 6 тем из game/profile_themes.css под карточку профиля этого сайта:
     карточка = .profile-head, обёрнутая в .profile-theme-card.theme-XXX. */
  .profile-theme-card {
    position: relative; z-index: 1; border-radius: var(--radius-sm); padding: 26px 16px; margin-bottom: 14px; overflow: hidden;
    min-height: 130px; display: flex; align-items: center;
  }
  .profile-theme-card .profile-head { margin-bottom: 0; position: relative; z-index: 2; width: 100%; }
  .profile-theme-card .theme-points-wrapper, .profile-theme-card .wheel-and-hamster { display: none; }

  /* Арлекин (Pop-Art / Comic) */
  .theme-harlequin {
    background:
      linear-gradient(245deg, #000000 0%, #fdff96 100%),
      linear-gradient(245deg, #0038ff 0%, #000000 100%),
      radial-gradient(100% 225% at 100% 0%, #4200ff 0%, #001169 100%),
      linear-gradient(245deg, #000000 0%, #ffb800 100%),
      radial-gradient(115% 107% at 40% 100%, #eaf5ff 0%, #eaf5ff 40%, #a9c6de calc(40% + 1px), #a9c6de 70%, #247e6c calc(70% + 2px), #247e6c 85%, #e4c666 calc(85% + 2px), #e4c666 100%),
      linear-gradient(65deg, #083836 0%, #083836 40%, #66d37e calc(40% + 1px), #66d37e 60%, #c6e872 calc(60% + 1px), #c6e872 100%) !important;
    background-blend-mode: overlay, screen, overlay, hard-light, overlay, normal !important;
    border: 4px solid #000 !important; box-shadow: 6px 6px 0 rgba(0,0,0,0.8) !important; border-radius: 12px !important;
    -webkit-transform: translate3d(0,0,0); transform: translateZ(0);
  }
  .theme-harlequin .profile-name {
    color: #fff !important;
    text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 4px 4px 0 rgba(0,0,0,0.5) !important;
    letter-spacing: 2px; font-weight: 900 !important;
  }
  .theme-harlequin .profile-online { color: #fff !important; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000; }

  /* Безмятежность (Serenity) */
  .theme-serenity {
    background: linear-gradient(180deg, #ff0b00 13%, #ff9e00 100%) !important;
    border: 2px solid #ff9e00 !important; box-shadow: 0 0 20px rgba(255,158,0,0.4) !important;
  }
  .theme-serenity::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.25); z-index: 0; pointer-events: none; }
  .theme-serenity .theme-points-wrapper { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
  .theme-serenity .theme-point { display: block; position: absolute; will-change: transform; }
  .theme-serenity .theme-point:nth-child(-n+5) {
    border-radius: 50%; background-color: rgba(255,255,255,0.15); box-shadow: 0 0 15px rgba(0,0,0,0.1);
    top: 0; right: 20%; transform: translate(50%, -50%);
  }
  .theme-serenity .theme-point:nth-child(1) { width: 220px; height: 220px; animation: ser-pulse 6s ease-in-out infinite; }
  .theme-serenity .theme-point:nth-child(2) { width: 170px; height: 170px; animation: ser-pulse 6s ease-in-out infinite 0.5s; }
  .theme-serenity .theme-point:nth-child(3) { width: 120px; height: 120px; animation: ser-pulse 6s ease-in-out infinite 1s; }
  .theme-serenity .theme-point:nth-child(4) { width: 70px; height: 70px; animation: ser-pulse 6s ease-in-out infinite 1.5s; }
  .theme-serenity .theme-point:nth-child(5) { width: 40px; height: 40px; background-color: #fff; box-shadow: 0 0 30px rgba(255,255,255,0.8); animation: none; }
  @keyframes ser-pulse { 0%, 100% { transform: translate(50%, -50%) scale(1); } 50% { transform: translate(50%, -50%) scale(1.03); } }
  .theme-serenity .theme-point:nth-child(n+6):nth-child(-n+8) { background-color: #3a3a3a; border-radius: 12px; }
  .theme-serenity .theme-point:nth-child(6) { width: 140px; height: 140px; bottom: -100px; left: -60px; z-index: 1; box-shadow: 0 0 30px rgba(0,0,0,0.8); animation: ser-drift1 12s ease-in-out infinite alternate; }
  .theme-serenity .theme-point:nth-child(7) { width: 110px; height: 110px; bottom: -80px; left: 15%; z-index: 0; background-color: #2b2b2b; animation: ser-drift2 15s ease-in-out infinite alternate; }
  .theme-serenity .theme-point:nth-child(8) { width: 160px; height: 160px; bottom: -115px; right: -40px; z-index: 2; box-shadow: 0 0 30px rgba(0,0,0,0.8); background-color: #454545; animation: ser-drift3 10s ease-in-out infinite alternate; }
  @keyframes ser-drift1 { 0% { transform: rotate(45deg) translate(0,0); } 100% { transform: rotate(45deg) translate(6px,6px); } }
  @keyframes ser-drift2 { 0% { transform: rotate(45deg) translate(0,0); } 100% { transform: rotate(45deg) translate(-4px,-4px); } }
  @keyframes ser-drift3 { 0% { transform: rotate(45deg) translate(0,0); } 100% { transform: rotate(45deg) translate(-8px,8px); } }
  .theme-serenity .theme-point:nth-child(n+9) { display: none; }
  .theme-serenity .profile-name, .theme-serenity .profile-online { color: #fff !important; text-shadow: 0 0 10px rgba(0,0,0,0.8), 2px 2px 4px rgba(0,0,0,0.8) !important; }

  /* Акварель (Aquarelle) */
  .theme-aquarelle {
    background-color: #050b14 !important; border: 2px solid transparent !important;
    box-shadow: inset 0 0 50px rgba(0,0,0,0.8) !important;
  }
  .theme-aquarelle::before { content: ""; position: absolute; inset: 2px; background: rgba(0,0,0,0.4); border-radius: inherit; z-index: -1; pointer-events: none; }
  .theme-aquarelle .theme-points-wrapper { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; pointer-events: none; overflow: hidden; }
  .theme-aquarelle .theme-point { display: block; position: absolute; width: 90px; height: 90px; border-radius: 50%; filter: blur(18px); will-change: transform; }
  .theme-aquarelle .theme-point:nth-child(1) { background: #ff007f; top: -20%; left: -10%; animation: aq-upRight 6s ease-in-out infinite; }
  .theme-aquarelle .theme-point:nth-child(2) { background: #ff6a00; top: 0%; left: 10%; animation: aq-downLeft 5s ease-in-out infinite; animation-delay: 1s; }
  .theme-aquarelle .theme-point:nth-child(3) { background: #ffcc00; top: 20%; left: 50%; animation: aq-right 4s ease-in-out infinite; animation-delay: 2s; }
  .theme-aquarelle .theme-point:nth-child(4) { background: #00fff0; top: -20%; left: 70%; animation: aq-upLeft 7s ease-in-out infinite; animation-delay: 3s; }
  .theme-aquarelle .theme-point:nth-child(5) { background: #9d00ff; top: 30%; left: -10%; animation: aq-downRight 3s ease-in-out infinite; animation-delay: 4s; }
  .theme-aquarelle .theme-point:nth-child(6) { background: #ff007f; top: -10%; left: 30%; animation: aq-left 8s ease-in-out infinite; animation-delay: 0.5s; }
  .theme-aquarelle .theme-point:nth-child(7) { background: #ff6a00; top: 40%; left: 60%; animation: aq-up 6s ease-in-out infinite; animation-delay: 1.5s; }
  .theme-aquarelle .theme-point:nth-child(n+8) { display: none; }
  @keyframes aq-upRight { 0%, 100% { transform: translate(0,0); } 25% { transform: translate(100%,-100%); } 50% { transform: translate(-50%,50%); } 75% { transform: translate(50%,-50%); } }
  @keyframes aq-downLeft { 0%, 100% { transform: translate(0,0); } 25% { transform: translate(-100%,100%); } 50% { transform: translate(50%,-50%); } 75% { transform: translate(-50%,50%); } }
  @keyframes aq-right { 0%, 100% { transform: translate(0,0); } 25% { transform: translate(100%,0); } 50% { transform: translate(-100%,50%); } 75% { transform: translate(50%,-50%); } }
  @keyframes aq-upLeft { 0%, 100% { transform: translate(0,0); } 25% { transform: translate(-100%,-100%); } 50% { transform: translate(50%,50%); } 75% { transform: translate(-50%,-50%); } }
  @keyframes aq-downRight { 0%, 100% { transform: translate(0,0); } 25% { transform: translate(100%,100%); } 50% { transform: translate(-50%,-50%); } 75% { transform: translate(50%,50%); } }
  @keyframes aq-left { 0%, 100% { transform: translate(0,0); } 25% { transform: translate(-100%,0); } 50% { transform: translate(100%,-50%); } 75% { transform: translate(-50%,50%); } }
  @keyframes aq-up { 0%, 100% { transform: translate(0,0); } 25% { transform: translate(0,-100%); } 50% { transform: translate(50%,50%); } 75% { transform: translate(-50%,-50%); } }
  .theme-aquarelle .profile-name, .theme-aquarelle .profile-online { color: #fff !important; text-shadow: 0 0 10px rgba(255,255,255,0.8), 0 0 20px #ff007f, 0 0 30px #00fff0 !important; }

  /* Ностальгия (Synthwave) */
  .theme-nostalgia {
    background-image: linear-gradient(#11091a, #11091a), linear-gradient(0deg, #ffdb3b 0%, #fe53bb 25%, #8f51ea 87%) !important;
    background-origin: border-box !important; background-clip: padding-box, border-box !important;
    border: 2px solid transparent !important; box-shadow: 0 0 30px rgba(254,83,187,0.2) !important;
  }
  .theme-nostalgia .theme-points-wrapper { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; perspective: 400px; }
  .theme-nostalgia .theme-point { display: none; }
  .theme-nostalgia .theme-points-wrapper::before {
    content: ""; position: absolute; top: 20%; left: -50%; width: 200%; height: 800%;
    background-image: linear-gradient(rgba(255,31,184,0.6) 2px, transparent 2px), linear-gradient(90deg, rgba(255,31,184,0.6) 2px, transparent 2px);
    background-size: 50px 50px; transform: rotateX(65deg); transform-origin: top center;
    animation: synthwave-fly 3s linear infinite; box-shadow: inset 0 0 50px #ff1fb8;
  }
  .theme-nostalgia .theme-points-wrapper::after {
    content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 60%;
    background-image: linear-gradient(to bottom, rgba(43,1,54,0.9) 0%, rgba(143,81,234,0.5) 40%, rgba(254,83,187,0.8) 80%, transparent 100%);
    z-index: 1;
  }
  @keyframes synthwave-fly { 0% { background-position: 0 0; } 100% { background-position: 0 50px; } }
  .theme-nostalgia .profile-name {
    background-image: linear-gradient(0deg, rgba(254,83,187,1) 0%, rgba(255,255,255,1) 45%, rgba(0,229,255,1) 100%) !important;
    background-clip: text !important; -webkit-background-clip: text !important; color: transparent !important;
    text-shadow: 0 0 2px rgba(255,255,255,0.8), 0 0 8px rgba(0,229,255,0.9), 0 0 15px rgba(254,83,187,0.7) !important;
    font-weight: 900 !important; letter-spacing: 2px;
  }
  .theme-nostalgia .profile-online { color: #fff !important; text-shadow: 0 0 8px rgba(0,229,255,0.7) !important; }

  /* Звёздная тишина (Starry Silence) */
  .theme-starry {
    background-image: linear-gradient(#050b14, #050b14), linear-gradient(137.48deg, #ffffff 10%, #4b5a77 45%, #ffc107 67%, #4b5a77 87%) !important;
    background-origin: border-box !important; background-clip: padding-box, border-box !important;
    border: 2px solid transparent !important; background-size: 300% 300% !important; background-position: 50% 50% !important;
    animation: starry-gradient 8s ease infinite !important;
    box-shadow: 0 0 30px rgba(255,255,255,0.05), inset 0 0 40px rgba(0,0,0,0.8) !important;
  }
  @keyframes starry-gradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
  .theme-starry .theme-points-wrapper { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
  .theme-starry .theme-point { display: none; }
  .theme-starry .theme-points-wrapper::before {
    content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
    background-image: radial-gradient(#ffffff 1px, transparent 1%); background-size: 50px 50px; opacity: 0.5;
    animation: animStarFall 50s linear infinite; will-change: transform;
  }
  .theme-starry .theme-points-wrapper::after {
    content: ""; position: absolute; top: -100%; left: -100%; width: 300%; height: 300%;
    background-image: radial-gradient(#ffffff 1px, transparent 1%); background-size: 70px 70px; opacity: 0.3;
    animation: animStarRotate 150s linear infinite; will-change: transform;
  }
  @keyframes animStarFall { from { transform: translateY(0); } to { transform: translateY(-250px); } }
  @keyframes animStarRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .theme-starry .profile-name { color: #fff !important; text-shadow: 0 0 10px rgba(255,255,255,0.8), 0 0 20px rgba(255,255,255,0.4) !important; letter-spacing: 2px; }
  .theme-starry .profile-online { color: #fff !important; text-shadow: 0 0 8px rgba(255,255,255,0.5) !important; }

  /* Верный друг (Hamster) */
  .theme-hamster { background: linear-gradient(135deg, #2d2318, #1a1510) !important; border: 2px solid hsl(30,90%,55%) !important; border-radius: 12px !important; }
  .theme-hamster .profile-name { color: hsl(30,90%,80%) !important; text-shadow: 2px 2px 0 #000 !important; }
  .theme-hamster .profile-online { color: hsl(30,90%,70%) !important; text-shadow: 1px 1px 0 #000; }
  .theme-hamster .wheel-and-hamster {
    display: block; --dur: 1s; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%) scale(1.3); opacity: 0.18; z-index: -1; pointer-events: none;
    width: 12em; height: 12em; font-size: 14px;
  }
  .theme-hamster .wheel, .theme-hamster .hamster, .theme-hamster .hamster div, .theme-hamster .spoke { position: absolute; }
  .theme-hamster .wheel, .theme-hamster .spoke { border-radius: 50%; top: 0; left: 0; width: 100%; height: 100%; }
  .theme-hamster .wheel { background: radial-gradient(100% 100% at center, hsla(0,0%,60%,0) 47.8%, hsl(0,0%,60%) 48%); z-index: 2; }
  .theme-hamster .hamster { animation: hamster var(--dur) ease-in-out infinite; top: 50%; left: calc(50% - 3.5em); width: 7em; height: 3.75em; transform: rotate(4deg) translate(-0.8em,1.85em); transform-origin: 50% 0; z-index: 1; }
  .theme-hamster .hamster__head { animation: hamsterHead var(--dur) ease-in-out infinite; background: hsl(30,90%,55%); border-radius: 70% 30% 0 100% / 40% 25% 25% 60%; box-shadow: 0 -0.25em 0 hsl(30,90%,80%) inset, 0.75em -1.55em 0 hsl(30,90%,90%) inset; top: 0; left: -2em; width: 2.75em; height: 2.5em; transform-origin: 100% 50%; }
  .theme-hamster .hamster__ear { animation: hamsterEar var(--dur) ease-in-out infinite; background: hsl(0,90%,85%); border-radius: 50%; box-shadow: -0.25em 0 hsl(30,90%,55%) inset; top: -0.25em; right: -0.25em; width: 0.75em; height: 0.75em; transform-origin: 50% 75%; }
  .theme-hamster .hamster__eye { animation: hamsterEye var(--dur) linear infinite; background-color: hsl(0,0%,0%); border-radius: 50%; top: 0.375em; left: 1.25em; width: 0.5em; height: 0.5em; }
  .theme-hamster .hamster__nose { background: hsl(0,90%,75%); border-radius: 35% 65% 85% 15% / 70% 50% 50% 30%; top: 0.75em; left: 0; width: 0.2em; height: 0.25em; }
  .theme-hamster .hamster__body { animation: hamsterBody var(--dur) ease-in-out infinite; background: hsl(30,90%,90%); border-radius: 50% 30% 50% 30% / 15% 60% 40% 40%; box-shadow: 0.1em 0.75em 0 hsl(30,90%,55%) inset, 0.15em -0.5em 0 hsl(30,90%,80%) inset; top: 0.25em; left: 2em; width: 4.5em; height: 3em; transform-origin: 17% 50%; transform-style: preserve-3d; }
  .theme-hamster .hamster__limb--fr, .theme-hamster .hamster__limb--fl { clip-path: polygon(0 0,100% 0,70% 80%,60% 100%,0% 100%,40% 80%); top: 2em; left: 0.5em; width: 1em; height: 1.5em; transform-origin: 50% 0; }
  .theme-hamster .hamster__limb--fr { animation: hamsterFRLimb var(--dur) linear infinite; background: linear-gradient(hsl(30,90%,80%) 80%,hsl(0,90%,75%) 80%); transform: rotate(15deg) translateZ(-1px); }
  .theme-hamster .hamster__limb--fl { animation: hamsterFLLimb var(--dur) linear infinite; background: linear-gradient(hsl(30,90%,90%) 80%,hsl(0,90%,85%) 80%); transform: rotate(15deg); }
  .theme-hamster .hamster__limb--br, .theme-hamster .hamster__limb--bl { border-radius: 0.75em 0.75em 0 0; clip-path: polygon(0 0,100% 0,100% 30%,70% 90%,70% 100%,30% 100%,40% 90%,0% 30%); top: 1em; left: 2.8em; width: 1.5em; height: 2.5em; transform-origin: 50% 30%; }
  .theme-hamster .hamster__limb--br { animation: hamsterBRLimb var(--dur) linear infinite; background: linear-gradient(hsl(30,90%,80%) 90%,hsl(0,90%,75%) 90%); transform: rotate(-25deg) translateZ(-1px); }
  .theme-hamster .hamster__limb--bl { animation: hamsterBLLimb var(--dur) linear infinite; background: linear-gradient(hsl(30,90%,90%) 90%,hsl(0,90%,85%) 90%); transform: rotate(-25deg); }
  .theme-hamster .hamster__tail { animation: hamsterTail var(--dur) linear infinite; background: hsl(0,90%,85%); border-radius: 0.25em 50% 50% 0.25em; box-shadow: 0 -0.2em 0 hsl(0,90%,75%) inset; top: 1.5em; right: -0.5em; width: 1em; height: 0.5em; transform: rotate(30deg) translateZ(-1px); transform-origin: 0.25em 0.25em; }
  .theme-hamster .spoke { animation: spoke var(--dur) linear infinite; background: radial-gradient(100% 100% at center,hsl(0,0%,60%) 4.8%,hsla(0,0%,60%,0) 5%), linear-gradient(hsla(0,0%,55%,0) 46.9%,hsl(0,0%,65%) 47% 52.9%,hsla(0,0%,65%,0) 53%) 50% 50% / 99% 99% no-repeat; }
  @keyframes hamster { from, to { transform: rotate(4deg) translate(-0.8em,1.85em); } 50% { transform: rotate(0) translate(-0.8em,1.85em); } }
  @keyframes hamsterHead { from, 25%, 50%, 75%, to { transform: rotate(0); } 12.5%, 37.5%, 62.5%, 87.5% { transform: rotate(8deg); } }
  @keyframes hamsterEye { from, 90%, to { transform: scaleY(1); } 95% { transform: scaleY(0); } }
  @keyframes hamsterEar { from, 25%, 50%, 75%, to { transform: rotate(0); } 12.5%, 37.5%, 62.5%, 87.5% { transform: rotate(12deg); } }
  @keyframes hamsterBody { from, 25%, 50%, 75%, to { transform: rotate(0); } 12.5%, 37.5%, 62.5%, 87.5% { transform: rotate(-2deg); } }
  @keyframes hamsterFRLimb { from, 25%, 50%, 75%, to { transform: rotate(50deg) translateZ(-1px); } 12.5%, 37.5%, 62.5%, 87.5% { transform: rotate(-30deg) translateZ(-1px); } }
  @keyframes hamsterFLLimb { from, 25%, 50%, 75%, to { transform: rotate(-30deg); } 12.5%, 37.5%, 62.5%, 87.5% { transform: rotate(50deg); } }
  @keyframes hamsterBRLimb { from, 25%, 50%, 75%, to { transform: rotate(-60deg) translateZ(-1px); } 12.5%, 37.5%, 62.5%, 87.5% { transform: rotate(20deg) translateZ(-1px); } }
  @keyframes hamsterBLLimb { from, 25%, 50%, 75%, to { transform: rotate(20deg); } 12.5%, 37.5%, 62.5%, 87.5% { transform: rotate(-60deg); } }
  @keyframes hamsterTail { from, 25%, 50%, 75%, to { transform: rotate(30deg) translateZ(-1px); } 12.5%, 37.5%, 62.5%, 87.5% { transform: rotate(10deg) translateZ(-1px); } }
  @keyframes spoke { from { transform: rotate(0); } to { transform: rotate(-1turn); } }
  .profile-avatar { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; background: var(--surface-2); flex-shrink: 0; }
  .profile-name { font-size: 17px; font-weight: 700; }
  .profile-online { font-size: 12px; color: var(--text-soft); margin-top: 2px; }
  .profile-section-title {
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    color: var(--text-soft); margin: 16px 0 8px; padding-top: 12px; border-top: 1px solid var(--border);
  }
  .profile-section-title:first-of-type { margin-top: 0; padding-top: 0; border-top: none; }
  .profile-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    font-size: 13.5px; padding: 5px 0;
  }
  .profile-row-label { display: flex; align-items: center; gap: 7px; color: var(--text-soft); }
  .profile-row-label svg, .profile-row-label img { width: 15px; height: 15px; flex-shrink: 0; color: var(--accent); }
  .profile-row-value { font-weight: 650; text-align: right; }
  .profile-cd-list { display: flex; flex-direction: column; gap: 4px; }
  .profile-cd-row { display: flex; justify-content: space-between; font-size: 13px; }
  .profile-cd-row .cd-name { color: var(--text-soft); }
  .profile-items-list { display: flex; flex-direction: column; gap: 3px; font-size: 13px; margin-top: 2px; }
  .profile-empty { font-size: 13px; color: var(--text-soft); }

  /* ── Модалка результата действия (медиа + что получено) ── */
  .media-modal-box img, .media-modal-box video {
    width: 100%; border-radius: var(--radius-sm); display: block; margin-bottom: 14px;
    background: var(--surface-2); max-height: 50vh; object-fit: cover;
  }
  #media-modal-result { font-size: 14px; margin-bottom: 14px; white-space: pre-line; line-height: 1.7; }
  #media-modal-result img, #media-modal-result svg { vertical-align: -2px; }
  #media-modal-close-btn { width: 100%; }
</style>
</head>
<body>
  <div class="wrap">
    <h1 class="hero" id="hero-title"></h1>
    <div id="root"></div>
  </div>

  <div id="event-timers-modal" class="modal-overlay" hidden>

      <div class="modal-header">

      </div>
      <div class="modal-body" id="container-info-modal-body"></div>
    </div>
  </div>

  <div id="info-modal" class="modal-overlay" hidden>
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title">Краткое руководство</div>
        <button id="info-modal-close" class="modal-close" aria-label="Закрыть">✕</button>
      </div>
      <div class="modal-body" id="info-modal-body"></div>
    </div>
  </div>

  <div id="paytable-modal" class="modal-overlay" hidden>
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title">Таблица наград — мини-игра</div>
        <button id="paytable-modal-close" class="modal-close" aria-label="Закрыть">✕</button>
      </div>
      <div class="modal-body" id="paytable-modal-body"></div>
    </div>

  <div id="profile-modal" class="modal-overlay" hidden>

  <div id="media-modal" class="modal-overlay" hidden>

        <div class="modal-title" id="media-modal-title"></div>

      </div>
      <div class="modal-body">
        <div id="media-modal-media"></div>
        <div id="media-modal-result"></div>
        <button id="media-modal-close-btn" class="btn-primary">Закрыть</button>
      </div>
    </div>
  </div>

  <script src="js/icons.js"></script>
  <script src="config.js"></script>
  <script src="js/api.js"></script>

  <script src="js/app.js"></script>
