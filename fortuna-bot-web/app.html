<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fortuna — экономика</title>
<style>
  :root {
    --bg: #f5f2ec; --surface: #fbf9f5; --surface-2: #f0ece3; --border: #e4ddd0;
    --text: #2a2722; --text-soft: #6b655c; --accent: #c8643c; --accent-soft: #f3e3da;
    --ok: #4a7c4e; --ok-bg: #e6f0e6; --err: #b5432f; --err-bg: #fbe8e4;
    --btn: #2a2722; --btn-text: #fbf9f5;
    --shadow: 0 1px 3px rgba(60,50,35,.06), 0 6px 20px rgba(60,50,35,.05);
    --radius: 16px; --radius-sm: 10px;
  }
  [data-theme="dark"] {
    --bg: #1f1d1a; --surface: #2a2723; --surface-2: #333029; --border: #3d3933;
    --text: #ece7df; --text-soft: #a39c8f; --accent: #e08252; --accent-soft: #3a2c23;
    --ok: #7fc283; --ok-bg: #253a26; --err: #e08a7a; --err-bg: #3a2621;
    --btn: #ece7df; --btn-text: #1f1d1a;
    --shadow: 0 1px 3px rgba(0,0,0,.25), 0 6px 20px rgba(0,0,0,.3);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1f1d1a; --surface: #2a2723; --surface-2: #333029; --border: #3d3933;
      --text: #ece7df; --text-soft: #a39c8f; --accent: #e08252; --accent-soft: #3a2c23;
      --ok: #7fc283; --ok-bg: #253a26; --err: #e08a7a; --err-bg: #3a2621;
      --btn: #ece7df; --btn-text: #1f1d1a;
      --shadow: 0 1px 3px rgba(0,0,0,.25), 0 6px 20px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 24px 16px 60px; }
  h1.hero { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 20px; color: var(--text); }

  .auth-card, .stats-grid, .actions-grid, .migrate-box, .result-box, .loading {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .auth-card { padding: 20px; }
  .tabs { display: flex; gap: 6px; background: var(--surface-2); border-radius: var(--radius-sm); padding: 4px; margin-bottom: 16px; }
  .tab { flex: 1; padding: 8px; border: none; background: none; cursor: pointer; font-family: inherit;
    font-size: 14px; font-weight: 600; color: var(--text-soft); border-radius: 7px; }
  .tab.active { background: var(--surface); color: var(--text); }
  .auth-form { display: flex; flex-direction: column; gap: 10px; }
  input {
    font-family: inherit; font-size: 15px; padding: 11px 13px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  .btn-primary, .btn-secondary {
    font-family: inherit; font-size: 15px; font-weight: 650; padding: 11px; border: none;
    border-radius: var(--radius-sm); cursor: pointer;
  }
  .btn-primary { background: var(--btn); color: var(--btn-text); }
  .btn-secondary { background: var(--accent); color: #fff; }
  .btn-ghost {
    font-family: inherit; background: none; border: 1px solid var(--border); color: var(--text-soft);
    padding: 6px 12px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13px;
  }
  .error-text { color: var(--err); font-size: 13px; min-height: 16px; }

  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .brand { font-size: 17px; font-weight: 650; }

  .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: var(--border); padding: 0; margin-bottom: 14px; overflow: hidden; }
  .stat { background: var(--surface); padding: 12px 10px; }
  .stat-label { font-size: 11px; color: var(--text-soft); margin-bottom: 4px; }
  .stat-value { font-size: 15px; font-weight: 650; }

  .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); padding: 0; margin-bottom: 14px; overflow: hidden; }
  .action-card {
    background: var(--surface); border: none; padding: 18px 12px; cursor: pointer; text-align: left;
    font-family: inherit; transition: background .15s;
  }
  .action-card:hover { background: var(--accent-soft); }
  .action-title { font-size: 15px; font-weight: 650; margin-bottom: 3px; }
  .action-sub { font-size: 12px; color: var(--text-soft); }

  .page-tabs { margin-bottom: 14px; }
  .btn-sm { padding: 7px 14px; font-size: 13px; white-space: nowrap; }

  .shop-list, .containers-grid { display: flex; flex-direction: column; gap: 1px; background: var(--border); margin-bottom: 4px; overflow: hidden; border-radius: var(--radius); }
  .shop-row {
    background: var(--surface); padding: 12px 14px; display: flex; align-items: center;
    justify-content: space-between; gap: 12px;
  }
  .shop-row-main { min-width: 0; }
  .shop-row-name { font-size: 14px; font-weight: 650; margin-bottom: 2px; }
  .shop-row-desc { font-size: 12px; color: var(--text-soft); }
  .shop-row-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
  .shop-row-price { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .shop-row-price s { color: var(--text-soft); font-weight: 400; margin-left: 4px; }
  .badge-owned {
    font-size: 11px; font-weight: 650; color: var(--ok); background: var(--ok-bg);
    padding: 3px 9px; border-radius: 20px;
  }
  .section-label { font-size: 13px; font-weight: 650; color: var(--text-soft); margin: 16px 0 8px; }

  .container-card { background: var(--surface); padding: 14px; }
  .container-card-name { font-size: 15px; font-weight: 650; margin-bottom: 2px; }
  .container-card-price { font-size: 12px; color: var(--text-soft); margin-bottom: 10px; }
  .container-buy-row { display: flex; gap: 8px; }

  .result-box { padding: 12px 14px; font-size: 14px; margin-bottom: 14px; }
  .result-ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
  .result-err { background: var(--err-bg); color: var(--err); border-color: transparent; }

  .migrate-box { padding: 14px; }
  .migrate-box summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--text-soft); }
  #migrate-form { display: flex; gap: 8px; margin-top: 12px; }
  #migrate-form input { flex: 1; text-transform: uppercase; }

  .loading { padding: 30px; text-align: center; color: var(--text-soft); }
</style>
</head>
<body>
  <div class="wrap">
    <h1 class="hero">⚔️ Fortuna — экономика</h1>
    <div id="root"></div>
  </div>

  <script src="config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
