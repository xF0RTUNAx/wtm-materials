<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ударный дрон</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1016; color: #eaf6ff;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,.45) 100%); }
  #flash { position: fixed; inset: 0; pointer-events: none; background: rgba(255,40,40,.5); opacity: 0; }

  /* ── HUD: зелёная символика в стиле ИЛС ── */
  #hud { position: fixed; inset: 0; pointer-events: none; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    text-shadow: 0 0 5px rgba(0,0,0,.9); display: none; color: #b8ffc8; }
  #hud.on { display: block; }
  .osd-tl { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 12px; width: min(40vw, 230px); }
  .osd-tr { position: absolute; top: max(10px, env(safe-area-inset-top)); right: 58px; text-align: right; color: #eaf6ff; }
  .osd-tc { position: absolute; top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); text-align: center; color: #eaf6ff; }
  .bar { height: 7px; border-radius: 2px; background: rgba(255,255,255,.14); overflow: hidden; margin: 2px 0 6px; }
  .bar > i { display: block; height: 100%; width: 100%; background: #4ade80; transition: width .08s linear; }
  #barHull > i { background: #f87171; }
  #barHeat > i { background: #fbbf24; }
  .lbl { font-size: 10px; letter-spacing: .1em; opacity: .8; }
  .big { font-size: 30px; font-weight: 800; line-height: 1; }
  #kills { color: #fef08a; }
  #combo { font-size: 13px; color: #fb923c; height: 16px; font-weight: 700; }
  #hdg { font-size: 11px; opacity: .8; margin-top: 2px; }
  #score { font-size: 15px; font-weight: 700; }

  #wpn { margin-top: 4px; font-size: 11.5px; line-height: 1.45; pointer-events: auto; cursor: pointer; background: rgba(0,20,10,.35);
    border: 1px solid rgba(140,255,170,.25); border-radius: 8px; padding: 5px 7px; }
  #wpn .row { display: flex; justify-content: space-between; gap: 8px; opacity: .55; }
  #wpn .row.sel { opacity: 1; color: #eaffea; font-weight: 700; }
  #wpn .row.sel::before { content: "▶"; margin-right: 4px; }
  #wpn .st { margin-top: 3px; font-weight: 700; color: #fde68a; min-height: 15px; }
  #wpn .fly { color: #93c5fd; }

  #cross { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; left: 50%; top: 50%; }
  #cross::before { content: ""; position: absolute; inset: 9px; border: 2px solid #b8ffc8; border-radius: 50%; }
  #cross::after { content: ""; position: absolute; left: -12px; right: -12px; top: 16px; height: 2px;
    background: linear-gradient(90deg, #b8ffc8 0 12px, transparent 12px calc(100% - 12px), #b8ffc8 calc(100% - 12px)); }
  #gunLock { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border: 1.5px dashed #fde68a; border-radius: 50%; display: none; }
  #seeker { position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; border: 2px solid #fbbf24; border-radius: 50%; display: none; }
  #seeker.lk { border-color: #ff5b5b; box-shadow: 0 0 10px rgba(255,80,80,.7); animation: blink .25s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  .mk { position: absolute; width: 0; height: 0; display: none; }
  .mk i { position: absolute; left: -8px; top: -8px; width: 16px; height: 16px; border: 1.5px solid #7CFF9B; transform: rotate(45deg); }
  .mk span { position: absolute; left: 14px; top: -7px; font-size: 10.5px; white-space: nowrap; font-weight: 700; }
  .mk.l i { left: -18px; top: -18px; width: 36px; height: 36px; border: 2px solid #ff5b5b; transform: none; box-shadow: 0 0 8px rgba(255,80,80,.6); }
  .mk.l span { left: 22px; top: -18px; color: #ffb4b4; }
  .mk.t i { border-color: #fde047; border-radius: 50%; transform: none; }
  .mk.t span { color: #fde047; }
  .mk.r i { border-color: #5cff8a; border-radius: 3px; transform: none; }
  .mk.r span { color: #5cff8a; }
  .mk.arr i { border: 0; transform: none; width: 0; height: 0; left: -9px; top: -9px; }
  .mk.arr i::before { content: "▲"; position: absolute; font-size: 20px; color: #ff5b5b; }
  .mk.arr.boss i::before { content: "◆"; color: #c084fc; }
  .mk.arr span { display: none; }

  .side { position: absolute; top: 50%; transform: translateY(-50%); font-size: 13px; font-weight: 700; padding: 3px 6px;
    border: 1.5px solid rgba(184,255,200,.7); border-radius: 3px; min-width: 64px; text-align: center; background: rgba(0,20,10,.25); }
  .side small { display: block; font-size: 9px; opacity: .7; font-weight: 400; }
  #spdBox { left: calc(50% - 190px); } #altBox { left: calc(50% + 126px); }
  body.coarse #spdBox { left: 8px; top: 62%; } body.coarse #altBox { left: auto; right: 8px; top: 62%; }
  .osd-bc { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); width: min(30vw, 190px); }
  body.coarse .osd-bc { display: none; }
  #radar { position: absolute; right: 14px; bottom: 14px; width: 170px; height: 170px; border-radius: 10px; }
  body.coarse #radar { width: 118px; height: 118px; right: 54px; bottom: auto; top: max(58px, env(safe-area-inset-top)); }
  #lockInfo { position: absolute; font-size: 11px; font-weight: 700; white-space: nowrap; display: none; }
  #warn { position: absolute; top: 24%; left: 50%; transform: translateX(-50%); font-size: 15px; font-weight: 800; color: #ff6b6b; letter-spacing: .08em; display: none; text-align: center; }
  #bossbar { position: absolute; top: 82px; left: 50%; transform: translateX(-50%); width: min(60vw, 360px); text-align: center; display: none; color: #eaf6ff; }
  #bossbar .bar { height: 9px; } #bossbar .bar > i { background: #c084fc; }
  #popups { position: absolute; top: 33%; left: 0; right: 0; text-align: center; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  .pop { font-size: 19px; font-weight: 800; color: #fde68a; animation: pop 1.3s ease-out forwards; margin-bottom: 4px; }
  .pop.good { color: #86efac; } .pop.bad { color: #fca5a5; } .pop.boss { color: #d8b4fe; font-size: 25px; } .pop.info { color: #93c5fd; font-size: 15px; }
  @keyframes pop { 0% { opacity: 0; transform: scale(.7); } 15% { opacity: 1; transform: scale(1.1); } 100% { opacity: 0; transform: translateY(-38px); } }
  #count { position: absolute; top: 38%; left: 0; right: 0; text-align: center; font-size: 84px; font-weight: 900; color: #fff; text-shadow: 0 0 24px rgba(0,0,0,.7); font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }

  #exit, #mute, #pause { position: fixed; top: max(10px, env(safe-area-inset-top)); width: 36px; height: 36px; border-radius: 10px; border: 1px solid rgba(255,255,255,.3);
    background: rgba(10,16,24,.55); color: #fff; font-size: 16px; display: none; align-items: center; justify-content: center; cursor: pointer; z-index: 20; }
  #exit { right: 10px; } #pause { right: 10px; top: 54px; } #mute { right: 10px; top: 98px; }
  body.playing #exit, body.playing #mute, body.playing #pause { display: flex; }
  body.menuing #exit { display: flex; }

  /* ── Мобильное управление ── */
  #touch { position: fixed; inset: 0; display: none; z-index: 10; }
  body.coarse.playing #touch { display: block; }
  #stickZone { position: absolute; left: 0; top: 0; bottom: 0; width: 50%; }
  #stickBase { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); background: rgba(255,255,255,.06); display: none; }
  #stickKnob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255,255,255,.45); }
  .tbtn { position: absolute; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); background: rgba(255,255,255,.12); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 11px; letter-spacing: .04em; touch-action: none; text-align: center; }
  .tbtn.on { background: rgba(255,120,60,.55); }
  #btnFire { right: 20px; bottom: 30px; width: 86px; height: 86px; font-size: 12px; }
  #btnMsl { right: 22px; bottom: 128px; width: 70px; height: 70px; background: rgba(251,146,60,.22); }
  #btnLock { right: 116px; bottom: 34px; width: 62px; height: 62px; background: rgba(74,222,128,.18); }
  #btnAB { right: 108px; bottom: 112px; width: 58px; height: 58px; background: rgba(96,165,250,.2); }

  /* ── Экраны ── */
  .screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px; z-index: 30; }
  .screen.on { display: flex; }
  #menu { justify-content: flex-start; padding-left: max(16px, 3vw);
    background: linear-gradient(90deg, rgba(6,12,20,.8) 0%, rgba(6,12,20,.45) 45%, rgba(6,12,20,0) 70%); }
  #pauseScr, #end { background: radial-gradient(ellipse at center, rgba(8,14,22,.72), rgba(4,8,12,.92)); }
  .card { width: min(94vw, 470px); max-height: 94vh; overflow: auto; background: rgba(15,23,34,.93); border: 1px solid rgba(255,255,255,.14);
    border-radius: 18px; padding: 18px 18px 16px; text-align: center; box-shadow: 0 14px 50px rgba(0,0,0,.55); }
  @media (max-aspect-ratio: 1/1) {
    #menu { align-items: flex-end; justify-content: center; padding: 10px;
      background: linear-gradient(0deg, rgba(6,12,20,.85) 0%, rgba(6,12,20,.4) 55%, rgba(6,12,20,0) 75%); }
    #menu .card { max-height: 62vh; }
  }
  .card h1 { margin: 0 0 2px; font-size: 23px; letter-spacing: .02em; }
  .card .sub { font-size: 13px; opacity: .75; margin-bottom: 10px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 99px; margin-bottom: 10px; letter-spacing: .04em; }
  .badge.train { background: rgba(96,165,250,.2); color: #93c5fd; } .badge.rank { background: rgba(251,191,36,.2); color: #fcd34d; }
  .help { text-align: left; font-size: 12.5px; line-height: 1.55; background: rgba(255,255,255,.05); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
  .help b { color: #fde68a; }
  .help p { margin: 0 0 7px; } .help p:last-child { margin: 0; }
  .btn { display: block; width: 100%; padding: 13px 14px; border-radius: 12px; border: 0; font-size: 15px; font-weight: 800; cursor: pointer;
    background: linear-gradient(180deg, #fb923c, #ea580c); color: #fff; margin-top: 8px; }
  .btn.alt { background: rgba(255,255,255,.1); font-weight: 600; }
  #startBtn { position: sticky; bottom: -16px; box-shadow: 0 -10px 18px rgba(15,23,34,.95); }
  .mtabs { display: flex; gap: 4px; background: rgba(255,255,255,.06); border-radius: 11px; padding: 3px; margin-bottom: 10px; }
  .mtabs button { flex: 1; border: 0; background: transparent; color: #cbd5e1; font-size: 12.5px; font-weight: 700; padding: 8px 2px; border-radius: 8px; cursor: pointer; }
  .mtabs button.on { background: rgba(251,146,60,.9); color: #fff; }
  .tabp { display: none; } .tabp.on { display: block; }

  .pyl-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-bottom: 8px; }
  .pyl { border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.05); color: #eaf6ff; border-radius: 9px; padding: 6px 2px; cursor: pointer; min-height: 52px; }
  .pyl small { display: block; font-size: 9.5px; opacity: .6; }
  .pyl b { display: block; font-size: 11.5px; margin-top: 3px; }
  .pyl.sel { border-color: #fb923c; background: rgba(251,146,60,.18); }
  .pyl.empty b { opacity: .4; font-weight: 500; }
  .pyl-row .mid-gap { grid-column: span 0; }
  .loadbar { height: 8px; border-radius: 4px; background: rgba(255,255,255,.1); overflow: hidden; }
  .loadbar i { display: block; height: 100%; background: linear-gradient(90deg, #4ade80, #fbbf24 70%, #f87171); }
  .loadtxt { font-size: 12px; opacity: .8; margin: 5px 0 8px; display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
  .pick-t { text-align: left; font-size: 12px; opacity: .75; margin: 2px 0 5px; display: flex; justify-content: space-between; align-items: center; }
  .pick-t label { opacity: 1; display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
  .opt { display: flex; width: 100%; align-items: center; gap: 8px; text-align: left; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04);
    color: #eaf6ff; border-radius: 10px; padding: 8px 9px; margin-bottom: 5px; cursor: pointer; font-size: 12.5px; }
  .opt.on { border-color: #fb923c; background: rgba(251,146,60,.14); }
  .opt.dis { opacity: .38; cursor: not-allowed; }
  .opt .nm { flex: 1; } .opt .nm b { display: block; font-size: 13.5px; } .opt .nm span { opacity: .7; font-size: 11.5px; }
  .opt .inf { color: #93c5fd; font-size: 12px; padding: 4px 6px; border-radius: 6px; background: rgba(96,165,250,.14); }
  .tag { display: inline-block; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 5px; letter-spacing: .03em; }
  .tag.ir { background: rgba(251,146,60,.25); color: #fdba74; } .tag.sarh { background: rgba(250,204,21,.2); color: #fde047; } .tag.arh { background: rgba(96,165,250,.22); color: #93c5fd; }

  details.ref { text-align: left; background: rgba(255,255,255,.05); border-radius: 12px; margin-bottom: 7px; overflow: hidden; }
  details.ref summary { cursor: pointer; padding: 10px 12px; font-weight: 800; font-size: 14px; list-style: none; display: flex; align-items: center; gap: 8px; }
  details.ref summary::-webkit-details-marker { display: none; }
  details.ref summary::after { content: "▾"; margin-left: auto; opacity: .6; }
  details.ref[open] summary::after { content: "▴"; }
  details.ref .body { padding: 0 12px 10px; font-size: 12.5px; line-height: 1.55; }
  details.ref h4 { margin: 8px 0 3px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #fdba74; }
  details.ref p { margin: 0 0 6px; }
  table.tt { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.tt td { padding: 3px 4px; border-bottom: 1px solid rgba(255,255,255,.07); vertical-align: top; }
  table.tt td:first-child { opacity: .7; width: 46%; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
  .stt { background: rgba(255,255,255,.06); border-radius: 12px; padding: 10px 6px; }
  .stt b { display: block; font-size: 22px; } .stt span { font-size: 11px; opacity: .7; }
  #endTitle.win { color: #86efac; }
  #serverMsg { font-size: 13px; margin: 6px 0 2px; min-height: 18px; color: #fde68a; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div><div id="flash"></div>

<div id="hud">
  <div class="osd-tl">
    <div class="lbl">ТОПЛИВО <span id="fuelTxt">75</span>с</div><div class="bar" id="barFuel"><i></i></div>
    <div class="lbl">КОРПУС</div><div class="bar" id="barHull"><i></i></div>
    <div id="wpn"></div>
  </div>
  <div class="osd-tc"><div class="lbl">СБИТО</div><div class="big" id="kills">0</div><div id="combo"></div></div>
  <div class="osd-tr"><div class="lbl">ОЧКИ</div><div id="score">0</div><div id="hdg"></div></div>
  <div id="bossbar"><div class="lbl">ПОДСТИЛКА УЛИТКИ</div><div class="bar"><i id="bossFill"></i></div></div>
  <div id="marks"></div>
  <div id="warn"></div>
  <div id="popups"></div>
  <div id="count"></div>
  <div id="cross"></div><div id="gunLock"></div><div id="seeker"></div><div id="lockInfo"></div>
  <div class="side" id="spdBox"><small>СКОРОСТЬ</small><span id="spd">0</span></div>
  <div class="side" id="altBox"><small>ВЫСОТА</small><span id="alt">0</span></div>
  <div class="osd-bc"><div class="lbl">ПУШКА · ПЕРЕГРЕВ</div><div class="bar" id="barHeat"><i style="width:0"></i></div></div>
  <canvas id="radar" width="300" height="300"></canvas>
</div>

<div id="touch">
  <div id="stickZone"><div id="stickBase"><div id="stickKnob"></div></div></div>
  <div class="tbtn" id="btnAB">ФОР-<br>САЖ</div>
  <div class="tbtn" id="btnLock">ЗАХВАТ</div>
  <div class="tbtn" id="btnMsl">РАКЕТА</div>
  <div class="tbtn" id="btnFire">ПУШКА</div>
</div>

<button id="exit" aria-label="Выйти">✕</button>
<button id="pause" aria-label="Пауза">II</button>
<button id="mute" aria-label="Звук">♪</button>

<div class="screen on" id="menu">
  <div class="card">
    <h1>Ударный дрон</h1>
    <div class="sub">«Фортуна С-1» против дронов «Подстилки улитки»</div>
    <div class="badge" id="modeBadge"></div>
    <div class="mtabs" id="mtabs">
      <button data-tab="load" class="on">Подвеска</button>
      <button data-tab="ref">Ракеты</button>
      <button data-tab="radar">Радар</button>
      <button data-tab="ctrl">Управление</button>
    </div>
    <div class="tabp on" id="tab-load"></div>
    <div class="tabp" id="tab-ref"></div>
    <div class="tabp" id="tab-radar"></div>
    <div class="tabp" id="tab-ctrl"></div>
    <button class="btn" id="startBtn">ВЗЛЁТ</button>
  </div>
</div>

<div class="screen" id="pauseScr">
  <div class="card">
    <h1>Пауза</h1>
    <button class="btn" id="resumeBtn">ПРОДОЛЖИТЬ</button>
    <button class="btn alt" id="pauseExit">Выйти</button>
  </div>
</div>

<div class="screen" id="end">
  <div class="card">
    <h1 id="endTitle">Вылет окончен</h1>
    <div class="sub" id="endReason"></div>
    <div class="stats">
      <div class="stt"><b id="eKills">0</b><span>сбито дронов</span></div>
      <div class="stt"><b id="eScore">0</b><span>очков</span></div>
      <div class="stt"><b id="eMsl">0/0</b><span>ракет: попаданий / пусков</span></div>
      <div class="stt"><b id="eAcc">0%</b><span>точность пушки</span></div>
    </div>
    <div id="eBoss" class="sub" style="margin:0"></div>
    <div id="serverMsg"></div>
    <button class="btn" id="againBtn">Ещё вылет</button>
    <button class="btn alt" id="closeBtn">Выйти</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';

// ═════════════ Параметры и режимы ═════════════
const Q = new URLSearchParams(location.search);
const TRAINING = Q.get('mode') === 'training';
const TEST = Q.get('test') === '1'; // отладочный хук window.__g — только вместе с mode=training
const SEED = ((parseInt(Q.get('seed'), 10) || Math.floor(Math.random() * 2147483646) + 1) >>> 0);
const IS_TOUCH = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
const H_CAP = 120;            // жёсткий потолок длины раунда, с (используется в buildSchedule — не менять)
const FUEL_START = 75;        // стартовое топливо, с
const FUEL_PICKUP = 5;        // +с за дозаправку от танкера (события 'battery' расписания)
const ARENA_R = 1000;
const CRUISE = 60, V_MIN = 40, V_MAX = 118;
const CEIL = 420;
const D2R = Math.PI / 180;
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wrapPI = (a) => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
const smooth01 = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ═════════════ Расписание волн — детерминированно от seed ═════════════
// Чистая функция без зависимости от DOM/three: сервер повторяет её (Deno) и по ней считает
// максимально возможное число сбитых за раунд (см. maxKills) для проверки результата.
// НЕ МЕНЯТЬ: на buildSchedule/maxKills/UNIT_KILLS/H_CAP опирается серверная проверка.
const UNIT_KILLS = { scout: 1, swarm: 1, armored: 1, kamikaze: 1, boss: 10 };
function buildSchedule(seed) {
  const rnd = mulberry32((seed ^ 0x9e3779b9) >>> 0);
  const ev = [];
  let i = 0;
  for (let t = 2; t < H_CAP - 5; t += 4.5, i++) {
    const d = t / H_CAP, r = rnd();
    let type, n;
    if (i === 0) { type = 'scout'; n = 3; }
    else if (r < 0.32 - d * 0.12) { type = 'scout'; n = 3 + ((rnd() * 2) | 0); }
    else if (r < 0.55) { type = 'swarm'; n = 5; }
    else if (r < 0.67 + d * 0.10 && d > 0.15) { type = 'armored'; n = 1 + (d > 0.5 ? 1 : 0); }
    else if (d > 0.1) { type = 'kamikaze'; n = 2 + (d > 0.5 ? 1 : 0) + ((rnd() * 2) | 0); }
    else { type = 'scout'; n = 3; }
    ev.push({ t, type, n });
  }
  ev.push({ t: 48, type: 'boss', n: 1 });
  for (let k = 0; k < 7; k++) ev.push({ t: 14 + k * 14, type: 'battery', n: 1 });
  ev.sort((a, b) => a.t - b.t);
  return ev;
}
function maxKills(ev) { return ev.reduce((s, e) => s + (UNIT_KILLS[e.type] ? UNIT_KILLS[e.type] * e.n : 0), 0); }

function terrainH(x, z) {
  const r = Math.hypot(x, z);
  const hills = 26 * Math.sin(x * 0.0043) * Math.cos(z * 0.0037) + 16 * Math.sin(x * 0.0091 + 1.3) * Math.sin(z * 0.0083)
    + 5 * Math.sin(x * 0.023) * Math.cos(z * 0.021);
  const open = smooth01(300, 620, r);                    // центр — ровная площадка под город
  const rim = Math.pow(smooth01(900, 1450, r), 1.5) * 190; // горы по краю карты
  return 12 + hills * (0.1 + 0.9 * open) + rim * (0.7 + 0.3 * Math.sin(Math.atan2(z, x) * 5 + 1));
}

const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _s = new THREE.Vector3(), _p = new THREE.Vector3();
function M(x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy = sx, sz = sx) {
  _e.set(rx, ry, rz); _q.setFromEuler(_e); _s.set(sx, sy, sz); _p.set(x, y, z);
  return new THREE.Matrix4().compose(_p, _q, _s);
}
function part(geo, color, m) { return { geo, color, m }; }
function mergeParts(parts) {
  let total = 0;
  const gs = parts.map((p) => {
    const g = p.geo.index ? p.geo.toNonIndexed() : p.geo.clone();
    if (g.attributes.uv) g.deleteAttribute('uv');
    if (g.attributes.uv2) g.deleteAttribute('uv2');
    if (!g.attributes.normal) g.computeVertexNormals();
    if (p.m) g.applyMatrix4(p.m);
    total += g.attributes.position.count; return g;
  });
  const pos = new Float32Array(total * 3), nor = new Float32Array(total * 3), col = new Float32Array(total * 3);
  let o = 0; const c = new THREE.Color();
  gs.forEach((g, i) => {
    const n = g.attributes.position.count;
    pos.set(g.attributes.position.array, o * 3); nor.set(g.attributes.normal.array, o * 3);
    c.set(parts[i].color);
    for (let k = 0; k < n; k++) { col[(o + k) * 3] = c.r; col[(o + k) * 3 + 1] = c.g; col[(o + k) * 3 + 2] = c.b; }
    o += n; g.dispose();
  });
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  out.setAttribute('color', new THREE.BufferAttribute(col, 3));
  out.computeBoundingSphere();
  return out;
}

function plateXZ(pts, thick) {
  const sh = new THREE.Shape(pts.map(([x, z]) => new THREE.Vector2(x, z)));
  const g = new THREE.ExtrudeGeometry(sh, { depth: thick, bevelEnabled: false });

}

function plateZY(pts, thick) {
  const sh = new THREE.Shape(pts.map(([z, y]) => new THREE.Vector2(z, y)));
  const g = new THREE.ExtrudeGeometry(sh, { depth: thick, bevelEnabled: false });

}

    updateBullets(dt); updateMissiles(dt); updateSlimes(dt); updateFlares(dt); updateTankers(dt); updateCrates(dt);
    if (G.runTime >= H_CAP) endGame('time');
    if (actx && engGain && !muted) {
      engGain.gain.value = 0.03 + (player.speed - 40) * 0.0005; engOsc.frequency.value = 70 + player.speed * 0.9;
      roarGain.gain.value = player.ab ? 0.09 : 0.035;
    }
    if (enemies.some((e) => e.type === 'boss' && !e.dead)) $('bossbar').style.display = 'block';
  }
  if (G.state === 'play' || G.state === 'countdown' || G.state === 'over') {
    if (G.state === 'over') { updateMissiles(dt); updateFlares(dt); }
    if (!G.over || player.hull > 0) placeShip(); else ship.visible = false;
    updateCamera(dt);
    if (G.state !== 'over') updateHud(dt);
  } else if (G.state === 'menu') menuView(dt, now);
  if (G.state !== 'pause') {
    SMOKE.update(dt); FX.update(dt);
    if (boomLight.intensity > 0) boomLight.intensity = Math.max(0, boomLight.intensity - dt * 9);
  }
  for (const e of enemies) if (G.state === 'countdown') for (const r of e.rotors) r.rotation.y += 40 * dt;
}
requestAnimationFrame(frame);

if (TEST && TRAINING) window.__g = { camera, ship, scene, G, player, enemies, missiles, tankers, crates, slimes, bullets, schedule, buildings, radar, seeker, input, keys, loaded, MISSILES, EN,
  spawnEnemy, spawnTanker, endGame, hurt, buildSchedule, maxKills, SEED, tick, render, launchMissile, cycleLock, cycleWeapon, updateHud,
  getSel: () => selType, gunT: () => gunTarget, setLoadout(arr) { loadout = arr.slice(); applyLoadout(); renderLoadTab(); },
  begin() { show('menu', false); setBody('playing'); $('hud').classList.add('on'); camera.clearViewOffset(); applyLoadout();
    player.pos.copy(START_POS); player.pos.y = terrainH(0, 620) + 120; camSnap = true; G.state = 'play'; } };
})();
</script>
