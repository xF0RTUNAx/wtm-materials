<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Дерево исследований</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Russo+One&display=swap">
<!-- Макет дерева исследований (AIRDEF_PROGRESSION.md) по образцу дерева WTM (Mark 2026-10-19): слева — стороны, колонки — ранги,
     линии — от предыдущей единицы к следующей, карточка — модель, название, ранг, роль, цена. Стороны — нейтрально, без цветов.
     ?v=1 — досье выбранной справа, v=2 — карточки с ТТХ, досье — окном; &b=pvo|air|wpn|strike, &s=east|west, &sel=pvo:kub.
     Данные — настоящие (games/airdef/progress.js), состояние игрока — пример середины игры. -->
<style>
  :root { --bg: #10140f; --bg2: #141912; --bg3: #181e15; --line: #39422f; --line2: #2c3426; --ac: #e8b04a; --ac2: #f3c96f; --tx: #e9e6dc; --dim: #b3baa5; --dim2: #8f9884; --ok: #86c06c; --xp: #9fd3ff;
    --cw: 184px; --ch: 82px; --gx: 26px; --gy: 14px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #10140f; color: var(--tx); font: 13px 'IBM Plex Sans', -apple-system, sans-serif; overflow: hidden; }
  .ic { width: 1.15em; height: 1.15em; vertical-align: -0.17em; flex: none; }
  #bgimg { position: fixed; inset: 0; background: url(../../games/airdef/shots/s400-unit.webp) center/cover; filter: blur(14px) brightness(.32) saturate(.7); transform: scale(1.06); }
  .top { position: fixed; left: 0; right: 0; top: 0; height: 58px; display: flex; align-items: center; gap: 14px; padding: 0 18px; background: linear-gradient(#0b0e0a, rgba(11,14,10,.86)); z-index: 5; }
  .back { font: 400 22px 'Russo One'; color: var(--tx); border: 0; background: none; width: 34px; }
  .top h1 { margin: 0; font: 400 19px 'Russo One'; letter-spacing: .02em; }
  .btabs { display: flex; margin-left: 10px; } .btabs button { border: 1px solid transparent; background: none; color: var(--dim); padding: 7px 13px; font: 500 14px 'IBM Plex Sans'; }
  .btabs button.on { color: var(--tx); border-color: var(--tx); } .btabs button i { font-style: normal; color: var(--dim2); font: 600 10.5px 'IBM Plex Mono'; margin-left: 5px; }
  .cur { display: flex; gap: 18px; margin-left: auto; font: 600 16px 'IBM Plex Mono'; } .cur span { display: flex; align-items: center; gap: 6px; } .cur .xp { color: var(--xp); }
  .sides { position: fixed; left: 0; top: 58px; bottom: 0; width: 122px; padding: 22px 0 0 14px; display: flex; flex-direction: column; gap: 10px; z-index: 4; }
  .sides button { border: 0; background: rgba(16,20,15,.88); color: var(--dim); height: 74px; text-align: left; padding: 0 12px; font: 400 15px 'Russo One'; border-left: 3px solid transparent; }
  .sides button small { display: block; font: 500 11px 'IBM Plex Sans'; color: var(--dim2); margin-top: 3px; } .sides button.on { background: rgba(233,230,220,.12); color: var(--tx); border-left-color: var(--tx); }
  .note { position: fixed; left: 18px; bottom: 14px; width: 114px; font-size: 11px; color: var(--dim2); line-height: 1.35; z-index: 4; }
  .wrap { position: fixed; left: 128px; top: 58px; right: 0; bottom: 0; overflow: auto; }
  .v1 .wrap { right: 290px; }
  .tree { position: relative; padding: 0 30px 40px 6px; }
  .ranks { position: sticky; top: 0; z-index: 3; display: flex; gap: var(--gx); padding: 12px 0 10px 6px; background: linear-gradient(rgba(16,20,15,.95) 70%, rgba(16,20,15,0)); }
  .rh { width: var(--cw); flex: none; } .rh b { font: 400 17px 'Russo One'; } .rh span { color: var(--dim); font-size: 12px; margin-left: 6px; }
  .rh .par { font-size: 11.5px; color: var(--dim); margin-top: 2px; } .rh .par b { font: 600 11.5px 'IBM Plex Sans'; color: var(--ac2); } .rh .par.okk { color: var(--ok); }
  svg.links { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; } svg.links path { fill: none; stroke: #8d9585; stroke-width: 2; } svg.links path.lock { stroke: #4a5243; }
  .shade { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, rgba(0,0,0,.18) 0 12px, rgba(0,0,0,.08) 12px 24px); pointer-events: none; }
  /* карточка — как в дереве WTM: модель на весь фон, название справа сверху, ранг справа снизу, цена слева снизу */
  .card { position: absolute; width: var(--cw); height: var(--ch); background: linear-gradient(160deg, #39403a 0, #22271f 55%, #151a12 100%); border: 1px solid #0a0c09; cursor: pointer; overflow: hidden; }
  .card img { position: absolute; left: -6px; top: 6px; width: 74%; height: 92%; object-fit: contain; object-position: left center; }
  .card .nm { position: absolute; right: 7px; top: 4px; font: 400 13.5px 'Russo One'; text-shadow: 0 1px 3px #000; max-width: 62%; text-align: right; }
  .card .rk { position: absolute; right: 7px; bottom: 2px; font: 400 18px 'Russo One'; color: #d9d6cb; text-shadow: 0 1px 3px #000; }
  .card .ro { position: absolute; right: 8px; top: 28px; color: #cfd2c6; font-size: 15px; } .card .ro .ic { width: 17px; height: 17px; }
  .card .pr { position: absolute; left: 6px; bottom: 5px; display: flex; align-items: center; gap: 5px; font: 600 13.5px 'IBM Plex Mono'; text-shadow: 0 1px 3px #000; padding: 1px 6px 1px 3px; background: rgba(10,12,9,.62); }
  .card .pr.xp { color: var(--xp); } .card .pr.sv { color: #eceae2; } .card .pr.no { color: var(--dim2); }
  .card .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(0,0,0,.4); } .card .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--xp); }
  .card .tag { position: absolute; left: 6px; top: 5px; font: 600 9.5px 'IBM Plex Mono'; letter-spacing: .04em; padding: 1px 5px; background: rgba(10,12,9,.7); }
  .card .tag.own { color: var(--ok); } .card .tag.start { color: var(--ac2); } .card .tag.goal { background: var(--xp); color: #0d1a24; }
  .card.own { background: linear-gradient(160deg, #4a5246 0, #2b3127 55%, #1a1f17 100%); }
  .card.can { box-shadow: 0 0 0 2px var(--ac) inset; }
  .card.lock img { filter: grayscale(1) brightness(.55); } .card.lock .nm, .card.lock .rk { color: #8d9585; } .card.lock { background: linear-gradient(160deg, #2a2f28 0, #191d16 100%); }
  .card.sel { outline: 2px solid var(--tx); outline-offset: 2px; } .card.pair { outline: 2px dashed var(--ac2); outline-offset: 2px; }
  .card .stl { position: absolute; left: 8px; right: 40px; bottom: 30px; font: 500 11px 'IBM Plex Sans'; color: #d9dccf; text-shadow: 0 1px 2px #000; display: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .v2 .card .stl { display: block; } .v2 .card img { top: 0; height: 74%; }
  /* досье */
  .dos { position: fixed; top: 58px; right: 0; bottom: 0; width: 290px; background: rgba(13,16,12,.96); border-left: 1px solid var(--line); display: flex; flex-direction: column; z-index: 4; }
  .v2 .dos { top: 50%; left: 50%; right: auto; bottom: auto; transform: translate(-50%, -50%); width: min(600px, 92vw); max-height: 88vh; border: 1px solid var(--line); box-shadow: 0 20px 60px rgba(0,0,0,.6); z-index: 9; }
  .v2 .veil { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 8; }
  .dos .sc { flex: 1; overflow: auto; padding: 0 14px 10px; } .dos .hero { margin: 0 -14px 8px; height: 150px; background: radial-gradient(ellipse at 50% 80%, #39403a 0, #151a12 75%); display: flex; }
  .dos .hero img { width: 100%; height: 100%; object-fit: contain; }
  .mk { font: 600 10.5px 'IBM Plex Mono'; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
  .dos h3 { margin: 2px 0 0; font: 400 19px/1.15 'Russo One'; } .dos .ty { color: var(--dim); font-size: 12px; margin: 2px 0 8px; }
  .st { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12.5px; } .st span { color: var(--dim2); } .st b { font-weight: 500; text-align: right; }
  .v2 .dos .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .dos p { color: #c9cebd; font-size: 12px; line-height: 1.5; margin: 8px 0; }
  .an { display: flex; gap: 8px; align-items: center; border: 1px dashed var(--line); padding: 5px; margin-top: 8px; } .an img { width: 82px; aspect-ratio: 16/9; object-fit: contain; background: #1a1f17; }
  .acts { padding: 10px 14px; border-top: 1px solid var(--line2); display: flex; flex-direction: column; gap: 6px; }
  .btn { border: 0; background: var(--ac); color: #17190f; font: 400 14px 'Russo One'; letter-spacing: .05em; padding: 11px; width: 100%; display: flex; justify-content: center; align-items: center; gap: 6px; }
  .btn.alt { background: none; border: 1px solid #4a5443; color: var(--tx); font: 500 13px 'IBM Plex Sans'; letter-spacing: 0; } .btn:disabled { background: #2c3426; color: var(--dim2); }
  .why { font-size: 11.5px; color: var(--dim); text-align: center; }
  @media (max-height: 460px) {
    :root { --cw: 196px; --ch: 80px; --gx: 40px; --gy: 12px; }
    .top { height: 46px; padding: 0 10px; gap: 8px; } .top h1 { display: none; } .btabs button { padding: 5px 8px; font-size: 12.5px; } .btabs button i { display: none; } .cur { font-size: 13px; gap: 10px; }
    .sides { top: 46px; width: 92px; padding: 10px 0 0 8px; } .sides button { height: 52px; font-size: 13px; padding: 0 8px; } .sides button small, .note { display: none; }
    .wrap { left: 96px; top: 46px; } .v1 .wrap { right: 0; } .v1 .dos { display: none; } .v1.open .dos { display: flex; top: 46px; width: 300px; }
    .card .nm { font-size: 12.5px; } .card .rk { font-size: 16px; } .card .pr { font-size: 12.5px; } .card .ro { top: 25px; } .card .stl { bottom: 24px; font-size: 10px; }
    .rh b { font-size: 14px; } .rh span { display: none; } .v2 .dos .hero { height: 110px; } .v2 .dos p { display: none; } .v2 .dos .two { grid-template-columns: 1fr; }
  }
</style></head>
<body><div id="bgimg"></div><div id="app"></div>
<script type="module">
import { NODE, BRANCHES, SIDES, SIDE_NAME, RANKS, RANK_NAME, nodesOf, owned, researched, rankOpen, rankBlock, canBuy, canResearch, cardStats, pairOf, unitType, treeLayout } from '../../games/airdef/progress.js?v=20261022l';
import { ico } from '../../games/airdef/icons.js?v=20261022l';
import { SAM, AG, ERAS, LOADOUTS } from '../../games/airdef/arsenal.js?v=20261022l';
const Q = new URLSearchParams(location.search), V = Q.get('v') || '1';
let RESET = false, B = Q.get('b') || 'pvo', S = Q.get('s') || 'east', SEL = Q.get('sel') || 'pvo:kub', OPEN = Q.has('open') || (V === '1' && innerHeight >= 460);
const P = { xp: 3400, silver: 2100, res: ['pvo:kub', 'pvo:igla', 'pvo:stinger', 'air:su30', 'wpn:kab500kr'], goal: { pvo: 'pvo:tunguska' },
  own: ['air:e_su17', 'air:f18', 'pvo:s125', 'pvo:osa', 'pvo:roland', 'pvo:gepard', 'wpn:kab500l', 'wpn:gbu12', 'wpn:kh58', 'wpn:agm88', 'strike:kh55_s', 'strike:tochka'] };
const n2 = (v) => v.toLocaleString('ru-RU'), thumb = (n) => `../../games/airdef/thumbs/${n.branch}_${n.key}.webp?v=20261022l`;
const XP = (v) => `${ico('xp')}${n2(v)}`, SV = (v) => `${ico('silver')}${n2(v)}`;
const era = (r) => ERAS[r - 1].name.split('— ')[1];
const ROLE = (n) => { const t = unitType(n); return /охотник|радиолок|подсвет|командн|ракету|активная|подавлен/.test(t) ? 'radar' : /тепловая|визир/.test(t) ? 'bino' : /артилл/.test(t) ? 'fire' : 'target'; };
const guide = (n) => (n.branch === 'pvo' ? SAM[n.key]?.guide : n.branch === 'air' ? `Подвески: ${RANKS.flatMap((e) => LOADOUTS[e].filter((L) => L.plane === n.key).map((L) => L.name)).join(' · ')}.` : AG[n.item || n.key]?.guide) || '';
function st(n) {
  if (n.start) return { k: 'start' }; if (owned(P, n.id)) return { k: 'own' };
  if (researched(P, n.id)) { const c = canBuy(P, n.id); return { k: 'buy', can: c.ok, why: c.why }; }
  if (!rankOpen(P, n.branch, n.rank) || (n.parent && !researched(P, n.parent))) return { k: 'lock', why: canResearch(P, n.id).why || '' };
  const c = canResearch(P, n.id); return { k: 'res', can: c.ok, why: c.why };
}
function card(c, x, y) {
  const n = c.n, s = st(n), sel = n.id === SEL, pr = pairOf(NODE[SEL]);
  const tag = s.k === 'own' ? '<span class="tag own">✓ КУПЛЕН</span>' : s.k === 'start' ? '<span class="tag start">★ СТАРТ</span>' : P.goal[n.branch] === n.id ? '<span class="tag goal">ЦЕЛЬ</span>' : '';
  const price = s.k === 'buy' ? `<span class="pr ${s.can ? 'sv' : 'no'}">${SV(n.cost)}</span>` : s.k === 'res' ? `<span class="pr ${s.can ? 'xp' : 'no'}">${XP(n.cost)}</span>` : s.k === 'lock' ? `<span class="pr no">${ico('lock')}${n2(n.cost)}</span>` : '';
  const bar = s.k === 'res' && P.goal[n.branch] === n.id ? `<div class="bar"><i style="width:${Math.min(100, P.xp / n.cost * 100)}%"></i></div>` : '';
  const CARD_K = { air: ['Скорость', 'Перегрузка'] }, cs = cardStats(n), pick = CARD_K[n.branch] ? cs.filter(([k]) => CARD_K[n.branch].includes(k)) : cs.slice(0, 2);
  const sl = pick.map(([k, v]) => `${k} ${v}`).join(' · ');
  return `<div class="card ${s.k === 'own' || s.k === 'start' ? 'own' : ''} ${s.can ? 'can' : ''} ${s.k === 'lock' ? 'lock' : ''} ${sel ? 'sel' : ''} ${pr && pr.id === n.id ? 'pair' : ''}" data-id="${n.id}" style="left:${x}px;top:${y}px">
    <img src="${thumb(n)}">${tag}<span class="nm">${n.short}</span><span class="ro">${ico(ROLE(n))}</span><span class="stl">${sl}</span><span class="rk">${RANK_NAME[n.rank]}</span>${price}${bar}</div>`;
}
function parity(r) {
  if (r === 1) return '<div class="par okk">открыт</div>';
  if (rankOpen(P, B, r)) return '<div class="par okk">паритет ранга ' + RANK_NAME[r - 1] + ' есть</div>';
  if (!rankOpen(P, B, r - 1)) return `<div class="par">сначала ранг ${RANK_NAME[r - 1]}</div>`;
  return `<div class="par">нужно в ранге ${RANK_NAME[r - 1]}: ${rankBlock(P, B, r).map((x) => `<b>${SIDE_NAME[x.side]} ${x.got}/${x.need}</b>`).join(', ')}</div>`;
}
function tree() {
  const cs = getComputedStyle(document.documentElement), px = (v) => parseFloat(cs.getPropertyValue(v)), ph = innerHeight < 460;
  const cw = px('--cw'), gx = px('--gx'), gy = px('--gy'), ch = px('--ch') + (V === '2' ? (ph ? 14 : 16) : 0), top = ph ? 52 : 68;
  const L = treeLayout(B, S), pos = {}; for (const c of L.cells) pos[c.n.id] = [c.col * (cw + gx) + 6, top + c.row * (ch + gy)];
  const H = top + L.rows * (ch + gy) + 20, W = 4 * (cw + gx) + 6;
  const links = L.links.map(([a, b]) => { const [x1, y1] = pos[a], [x2, y2] = pos[b], xa = x1 + cw, ya = y1 + ch / 2, yb = y2 + ch / 2, xm = x2 - gx / 2;
    return `<path class="${st(NODE[b]).k === 'lock' ? 'lock' : ''}" d="M${xa} ${ya} H${xm} V${yb} H${x2}"/>`; }).join('');
  const shade = RANKS.filter((r) => !rankOpen(P, B, r)).map((r) => `<div class="shade" style="left:${(r - 1) * (cw + gx) + 6 - gx / 2}px;width:${cw + gx}px"></div>`).join('');
  return `<div class="tree" style="width:${W + 30}px;height:${H}px;--ch:${ch}px"><div class="ranks">${RANKS.map((r) => `<div class="rh"><b>Ранг ${RANK_NAME[r]}</b><span>${era(r)}</span>${parity(r)}</div>`).join('')}</div>
    ${shade}<svg class="links" width="${W}" height="${H}">${links}</svg>${L.cells.map((c) => card(c, ...pos[c.n.id])).join('')}</div>`;
}
function dossier() {
  const n = NODE[SEL], s = st(n), p = pairOf(n), sp = p && st(p);
  const act = s.k === 'buy' ? `<button class="btn" ${s.can ? '' : 'disabled'}>КУПИТЬ ${SV(n.cost)}</button>${s.why ? `<div class="why">${s.why}</div>` : ''}`
    : s.k === 'res' ? `<button class="btn" ${s.can ? '' : 'disabled'}>ИССЛЕДОВАТЬ ${XP(n.cost)}</button><button class="btn alt">${P.goal[n.branch] === n.id ? 'Цель исследования ✓' : 'Сделать целью'}</button>${s.why ? `<div class="why">${s.why}</div>` : ''}`
    : s.k === 'lock' ? `<div class="why">${s.why}</div>` : `<button class="btn alt">В бой (Реализм)</button>`;
  const stats = `<div class="st">${cardStats(n).map(([k, v]) => `<span>${k}</span><b>${v}</b>`).join('')}</div>`;
  const an = p ? `<div class="an"><img src="${thumb(p)}"><div><span class="mk">аналог · ${SIDE_NAME[p.side]}</span><div style="font:400 13px 'Russo One'">${p.short}</div><div style="font-size:11px;color:var(--dim)">${sp.k === 'own' ? '✓ куплен' : sp.k === 'start' ? '★ стартовый' : sp.k === 'lock' ? ico('lock') + ' закрыт' : 'не куплен'}</div></div></div>` : '';
  return `${V === '2' || innerHeight < 460 ? '<div class="veil" data-close="1"></div>' : ''}<div class="dos"><div class="sc"><div class="hero"><img src="${thumb(n)}"></div>
    <span class="mk">${SIDE_NAME[n.side]} · ранг ${RANK_NAME[n.rank]} · ${era(n.rank)}</span><h3>${n.name}</h3><div class="ty">${unitType(n)}</div>
    ${V === '2' ? `<div class="two"><div>${stats}${an}</div><p style="margin:0">${guide(n)}</p></div>` : `${stats}<p>${guide(n)}</p>${an}`}</div><div class="acts">${act}</div></div>`;
}
function draw() {
  const w0 = document.querySelector('.wrap'), keep = w0 ? [w0.scrollLeft, w0.scrollTop] : null; // выбор единицы — дерево стоит на месте
  document.body.className = 'v' + V + (OPEN ? ' open' : '');
  document.getElementById('app').innerHTML = `<div class="top"><button class="back">«</button><h1>Исследования</h1><div class="btabs">${BRANCHES.map((b) => `<button data-b="${b.id}" class="${b.id === B ? 'on' : ''}">${b.name}<i>${RANKS.filter((r) => rankOpen(P, b.id, r)).length}/4</i></button>`).join('')}</div>
    <div class="cur"><span class="xp">${XP(P.xp)}</span><span>${SV(P.silver)}</span></div></div>
    <div class="sides">${SIDES.map((s) => `<button data-s="${s}" class="${s === S ? 'on' : ''}">${SIDE_NAME[s]}<small>куплено ${nodesOf(B, s).filter((n) => owned(P, n.id)).length} из ${nodesOf(B, s).length}</small></button>`).join('')}</div>
    <div class="note">Только для «Реализма». Аркада и обучение — всё открыто.</div>
    <div class="wrap">${tree()}</div>${OPEN ? dossier() : ''}`;
  if (keep && !RESET) { const w = document.querySelector('.wrap'); w.scrollLeft = keep[0]; w.scrollTop = keep[1]; } RESET = false;
  window.__ok = 1;
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-id],[data-b],[data-s],[data-close]'); if (!t) return;
  if (t.dataset.close) OPEN = false;
  if (t.dataset.id) { SEL = t.dataset.id; OPEN = true; }
  if (t.dataset.b || t.dataset.s) { RESET = true; if (t.dataset.b) B = t.dataset.b; if (t.dataset.s) S = t.dataset.s; SEL = (nodesOf(B, S, 2)[0] || nodesOf(B, S)[0]).id; }
  draw();
});
addEventListener('resize', draw); draw();
</script></body></html>
