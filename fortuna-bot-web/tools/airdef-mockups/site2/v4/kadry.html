.kd { padding-top: 56px; padding-bottom: 96px; }
.kd-home { display: inline-block; line-height: 0; margin-bottom: 36px; }

#lb { position: fixed; inset: 0; z-index: 10; background: rgba(10,9,8,.96); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
#lb.on { display: flex; }
#lb img { max-width: 100%; max-height: calc(100% - 60px); object-fit: contain; aspect-ratio: auto; background: none; }
#lb p { margin-top: 12px; text-align: center; }
@media (max-width: 900px) { .kd .kd-home img { width: 74px; } .kd h1 { font-size: 30px; } .kd-grid { grid-template-columns: 1fr; gap: 28px; } }

<div id="lb" role="dialog" aria-modal="true"><img alt=""><p></p></div>
<script>
(function () {
  var links = Array.prototype.slice.call(document.querySelectorAll('.kd-grid a')), lb = document.getElementById('lb'), im = lb.querySelector('img'), cap = lb.querySelector('p'), cur = -1;
  function show(i) { cur = (i + links.length) % links.length; var a = links[cur]; im.src = a.href; cap.textContent = a.parentNode.querySelector('figcaption').firstChild.textContent + ' ' + a.parentNode.querySelector('figcaption').childNodes[1].textContent; lb.classList.add('on'); }
  links.forEach(function (a, i) { a.addEventListener('click', function (e) { e.preventDefault(); show(i); }); });
  lb.addEventListener('click', function () { lb.classList.remove('on'); });
  addEventListener('keydown', function (e) { if (!lb.classList.contains('on')) return; if (e.key === 'Escape') lb.classList.remove('on'); if (e.key === 'ArrowRight') show(cur + 1); if (e.key === 'ArrowLeft') show(cur - 1); });
})();
</script>
