// состояние 1: F-4, ранг I (две подвески); состояние 2: ранг II (три вида оружия и контейнер) + закрытая подвеска ранга III
const S1 = { rank: 1, list: los(1, 'e_f4').map((L, i) => ({ L, on: i === 0 })) };
const S2 = { rank: 2, list: [{ L: los(2, 'e_f4')[0], on: true }, { L: los(3, 'e_f4')[0], lock: 'нужен HARM' }] };
const ROM = ['I', 'II', 'III', 'IV'], role = (L) => loadoutRole(L), rn = (L) => ROLE_NAME[role(L)];
const rk = (r) => `<div class="rk"><span>РАНГ</span>${ROM.map((x, i) => `<b class="${i + 1 === r ? 'on' : ''}">${x}</b>`).join('')}</div>`;

// ── А · слоты
const pA = (S) => `<div class="pA"><div class="set">${rk(S.rank)}<span class="cond">Аркада · ПВО сов.<i class="chev"></i></span></div>${S.list.map(({ L, on, lock }) =>
  `<div class="lo ${role(L)} ${on ? 'on' : ''} ${lock ? 'lock' : ''}"><div class="hd"><span>${rn(L)}</span>${on ? `<span class="ck">${ico('ok')}</span>` : lock ? `<span class="lk">${ico('lock')} ${lock}</span>` : ''}</div>
   <div class="sl">${L.items.map(([k, n]) => `<div class="t"><div class="im"><img src="${TH(k)}"></div><u>×${n}</u><em>${AG[k].short}</em></div>`).join('')}${L.pod ? `<div class="t"><div class="im">${ico('target')}</div><em>контейнер</em></div>` : ''}</div></div>`).join('')}</div>`;
// ── Б · вкладки
const pB = (S) => { const cur = S.list.find((x) => x.on).L;
  return `<div class="pB"><div class="bar"><span class="stp"><i>‹</i><b><s>РАНГ</s>${ROM[S.rank - 1]}</b><i>›</i></span><span class="cond">Аркада · ПВО сов.<i class="chev"></i></span></div>
  <div class="tabs">${S.list.map(({ L, on, lock }) => `<button class="${on ? 'on' : ''} ${lock ? 'lock' : ''}">${lock ? ico('lock') : ico(role(L) === 'sead' ? 'radar' : 'target')}${rn(L)}</button>`).join('')}</div>
  <div class="body">${cur.items.map(([k, n]) => `<div class="w"><img src="${TH(k)}"><b>${AG[k].short}</b><u><s>×</s>${n}</u></div>`).join('')}${cur.pod ? `<div class="w pod">${ico('target')} прицельный контейнер</div>` : ''}</div></div>`; };
// ── В · таблички
const pC = (S) => `<div class="pC"><div class="set"><span class="tagw">РАНГ ${ROM[S.rank - 1]}</span><span class="cond">Аркада · ПВО советская<i class="chev"></i></span></div>${S.list.map(({ L, on, lock }) =>
  `<div class="lo ${on ? 'on' : ''} ${lock ? 'lock' : ''}">${on ? '<i class="pin"></i>' : ''}<div class="hd"><span>${rn(L)}</span>${lock ? `<span style="margin-left:auto;letter-spacing:0;text-transform:none;font:500 9.5px 'Golos Text'">${ico('lock')} ${lock}</span>` : ''}</div>
   <div class="sl">${L.items.map(([k, n]) => `<div class="t"><div class="im"><img src="${TH(k)}"></div><em>${AG[k].short}<u>×${n}</u></em></div>`).join('')}${L.pod ? `<div class="t" style="flex:0 0 50px"><div class="im">${ico('target')}</div><em>контейнер</em></div>` : ''}</div></div>`).join('')}</div>`;
// ── Г · схема: вид спереди, точки подвески от законцовки к оси
const COL = ['#f3c96f', '#ece8dc', '#8fc0e6'];
const scheme = (L) => { const cx = 118, slots = [58, 37, 22, 10], wy = (d) => d < 66 ? 18.6 + d / 100 : 19.2 - (d - 66) * .25; let s = 0, pips = '';
  L.items.forEach(([k, n], wi) => { const c = COL[wi], msl = !['bomb', 'lgb', 'gps', 'tvb'].includes(AG[k].kind);
    if (n === 1) { pips += `<rect x="${cx - 3.5}" y="31" width="7" height="6" fill="${c}"/>`; return; }
    for (let p = 0; p < n / 2; p++) { const d = slots[Math.min(s++, 3)]; for (const sg of [-1, 1]) { const x = cx + sg * d, y0 = d < 25 ? 27 : wy(d) + 2, y = y0 + 6.5;
      pips += `<line x1="${x}" y1="${y0}" x2="${x}" y2="${y - 3}" stroke="#8d9580" stroke-width="1.2"/>` + (msl ? `<path d="M${x - 4.6} ${y - 4.6}l9.2 9.2M${x + 4.6} ${y - 4.6}l-9.2 9.2" stroke="${c}" stroke-width="1.1"/>` : '') + `<circle cx="${x}" cy="${y}" r="${msl ? 2.6 : 3.6}" fill="${c}"/>`; } } });
  if (L.pod) pips += `<rect x="${cx - 3}" y="30.5" width="6" height="6" fill="none" stroke="#b9c0ad" stroke-width="1.3"/>`;
  return `<svg class="sch" viewBox="0 0 236 40"><path d="M${cx - 9} 14 ${cx - 46} 24.5 ${cx - 46} 25.6 ${cx - 9} 17zM${cx + 9} 14 ${cx + 46} 24.5 ${cx + 46} 25.6 ${cx + 9} 17z" fill="#3a4231"/><path d="M${cx - 13} 15.5 ${cx - 66} 17.2 ${cx - 100} 9.4 ${cx - 100} 10.6 ${cx - 66} 19.2 ${cx - 13} 20zM${cx + 13} 15.5 ${cx + 66} 17.2 ${cx + 100} 9.4 ${cx + 100} 10.6 ${cx + 66} 19.2 ${cx + 13} 20z" fill="#66715a"/><path d="M${cx - 1.2} 0h2.4l1.3 9h-5z" fill="#66715a"/><rect x="${cx - 17}" y="11" width="34" height="14.5" rx="4.5" fill="#2f3728" stroke="#75806a" stroke-width=".9"/><ellipse cx="${cx}" cy="17.2" rx="8.6" ry="10.2" fill="#3d4634" stroke="#75806a" stroke-width=".9"/><ellipse cx="${cx}" cy="10.2" rx="4" ry="3" fill="#86a3b0" opacity=".85"/>${pips}</svg>`; };
const pD = (S) => `<div class="pD"><div class="set"><div class="rk2">${ROM.map((x, i) => `<b class="${i + 1 === S.rank ? 'on' : ''}">${i + 1 === S.rank ? 'РАНГ ' : ''}${x}</b>`).join('')}</div><div class="tg"><b class="on">Аркада</b><b>Реализм</b></div><div class="tg"><b class="on">ПВО сов.</b><b>ПВО зап.</b></div></div>${S.list.map(({ L, on, lock }) =>
  `<div class="lo ${role(L)} ${on ? 'on' : ''} ${lock ? 'lock' : ''}"><div class="hd"><span>${rn(L)}</span>${lock ? `<i>${ico('lock')} ${lock}</i>` : ''}</div>${scheme(L)}
   <div class="lg">${L.items.map(([k, n], i) => `<span><i style="background:${COL[i]}"></i><img src="${TH(k)}">${AG[k].short} <u>×${n}</u></span>`).join('')}${L.pod ? `<span>${ico('target')} контейнер</span>` : ''}</div></div>`).join('')}</div>`;

// ── бой
const B1 = { v: 869, h: 1798, fuel: 99, w: [{ k: 'mk82', n: 2, res: 4, on: 1 }, { k: 'agm45', n: 4, res: 8 }], st: 'падение через 18 с', fl: 200, task: ['radar', 'РЛС 0/3'] };
const B2 = { v: 1124, h: 2350, fuel: 18, ab: 1, w: [{ k: 'gbu10', n: 3, res: 4, on: 1, rt: 12 }], st: 'падение через 9 с', fly: 1, pod: { nm: 'Узел связи', d: '8.8' }, fl: 140, task: ['target', 'цели 1/3'], hull: 'Повреждён · двигатель' };
const fuel = (B) => `<span class="fu ${B.fuel < 20 ? 'low' : ''}">${ico('fuel')}<span class="bar"><u style="width:${B.fuel}%"></u></span>${B.fuel}</span>`;
const podL = (B) => B.pod ? `<div class="pd">${ico('target')} ${B.pod.nm} ${B.pod.d} км <span class="lk">захват</span><span class="tv on">ТВ</span></div>` : '';
const cnt = (B) => `<div class="ct"><span>${ico('flares')}${B.fl}</span><span>${ico(B.task[0])}${B.task[1]}</span>${B.hull ? `<span class="hl">${B.hull}</span>` : ''}</div>`;
const stT = (B) => `${B.st}${B.fly ? ` <span class="fly">· в полёте ${B.fly}</span>` : ''}`;
const hA = (B) => `<div class="hud hA"><div class="r1"><span class="v"><b>${B.v}</b><i>КМ/Ч</i></span><span class="v"><b>${B.h}</b><i>М</i></span>${fuel(B)}${B.ab ? '<span class="ab">ФОРСАЖ</span>' : ''}</div>
  <div class="wp">${B.w.map((w) => `<span class="w ${w.on ? 'on' : ''}"><img src="${TH(w.k)}"><b>${AG[w.k].short}</b><u>${w.n}</u><i>+${w.res}${w.rt ? ` ${ico('rotCw')}${w.rt}` : ''}</i></span>`).join('')}</div>
  <div class="st">${stT(B)}</div>${podL(B)}${cnt(B)}</div>`;
const hB = (B, m = '') => `<div class="hud hB ${m}"><div class="g3">${m === 'b3' ? `<div class="c"><b>${B.v}<small>КМ/Ч</small></b>${B.ab ? '<span class="ab">Ф</span>' : ''}</div><div class="c"><b>${B.h}<small>М</small></b></div><div class="c ${B.fuel < 20 ? 'low' : ''}"><b>${ico('fuel')}${B.fuel}<small>%</small></b></div>` : `<div class="c"><s>СКОРОСТЬ</s><b>${B.v}</b>${B.ab ? '<span class="ab">Ф</span>' : ''}</div><div class="c"><s>ВЫСОТА</s><b>${B.h}</b></div><div class="c ${B.fuel < 20 ? 'low' : ''}"><s>ТОПЛИВО</s><b>${B.fuel}<small>%</small></b></div>`}</div>
  <div class="ws">${B.w.map((w) => `<span class="w ${w.on ? 'on' : ''}"><img src="${TH(w.k)}"><b>${AG[w.k].short}</b>${w.rt ? `<span class="rs">${ico('rotCw')}${w.rt}</span>` : ''}<u>${w.n}<span class="rs"> +${w.res}</span></u></span>`).join('')}</div>
  <div class="st">${stT(B)}</div>${podL(B)}${cnt(B)}</div>`;
const hC = (B) => `<div class="hud hC"><div class="rb"><span>${B.v}<small>КМ/Ч</small></span><span>${B.h}<small>М</small></span><span class="${B.fuel < 20 ? 'low' : ''}">${ico('fuel')}${B.fuel}%</span>${B.ab ? '<span class="ab" style="font-size:9px">ФОРСАЖ</span>' : ''}<span>${ico('flares')}${B.fl}</span><span>${ico(B.task[0])}${B.task[1].replace(/^\D+/, '')}</span></div>
  <div class="ws">${B.w.map((w) => `<span class="w ${w.on ? 'on' : ''}"><img src="${TH(w.k)}"><b>${AG[w.k].short}</b><span class="rs">${w.rt ? `${ico('rotCw')}${w.rt} ` : ''}+${w.res}</span><u>${w.n}</u></span>`).join('')}${B.pod ? `<span class="w tvw on"><span>${ico('target')} ${B.pod.nm} ${B.pod.d} · <b>захват</b></span><span class="tv on" style="margin:0">ТВ</span></span>` : ''}</div>
  <div class="st">${stT(B)}${B.hull ? ` <span class="hl" style="color:#ffb066">· ${B.hull}</span>` : ''}</div></div>`;
const T1 = 'Охота за ПВО: уничтожьте 3 из 5 комплексов с РЛС (цели города - по желанию). · Заход с северо-запада, на средней высоте';
const MSG = { m1: `<div class="msg m1">${T1}</div>`, m2: `<div class="msg m2"><s>ОХОТА ЗА ПВО</s>Уничтожьте 3 из 5 комплексов с РЛС, цели города - по желанию. Заход с северо-запада, на средней высоте</div>`,
  m3: `<div class="msg m3">ОХОТА ЗА ПВО · 3 ИЗ 5 КОМПЛЕКСОВ С РЛС<small>Цели города - по желанию. Заход с северо-запада, на средней высоте</small></div>` };

const F = [
  ['h1', 'Панель подвесок в ангаре'],
  ['pA', 'А · «Слоты»', 'Ранг переключается сразу, четырьмя клетками. Подвеска - ряд слотов с миниатюрой и количеством, роль - цветная кромка и подпись. Панель по высоте содержимого, ангар открыт.', pA, 'hg'],
  ['pB', 'Б · «Вкладки»', 'Роли - вкладки, видна одна подвеска, зато миниатюры крупные и количество читается издалека. Блок стоит над кнопкой «Взлёт».', pB, 'hg'],
  ['pC', 'В · «Таблички»', 'Те же материалы, что у заданий и кнопки «Взлёт»: клёпаная пластина, деревянная бирка, выбранная подвеска приколота кнопкой.', pC, 'hg'],
  ['pD', 'Г · «Схема»', 'Самолёт спереди и точки подвески: видно, что и куда повешено. Все условия вылета открыты без выпадающего списка.', pD, 'hg'],
  ['h1', 'Бой: левый верхний блок и надпись задания'],
  ['hA', '1 · «Приборы»', 'Без рамки: крупные цифры скорости и высоты, топливо полоской, оружие с миниатюрами, выбранное подчёркнуто. Надпись задания - белая с тенью.', hA, 'bt', 'm1'],
  ['hB', '2 · «Табло»', 'Плита в стиле меню: ячейки с подписями, выбранное оружие отмечено сверху. Надпись задания - белая на тёмной полосе с заголовком.', hB, 'bt', 'm2'],
  ['hC', '3 · «Лента»', 'Одна строка приборов и плитки оружия как слоты в ангаре. Самый низкий блок. Надпись задания - заголовок и строка пояснения.', hC, 'bt', 'm3'],
];
const app = document.getElementById('app'); if (ONE) document.body.classList.add('one');
const SEC = Q.get('s'); let sec = '';
app.innerHTML = F.filter((f) => { if (f[0] === 'h1') sec = f[1][0] === 'П' ? 'p' : 'h'; return (!ONE || f[0] === ONE.replace(/2$/, '')) && (!SEC || sec === SEC); }).map(([id, t, d, fn, bg, m]) => id === 'h1' ? `<h1>${t}</h1>` : `<h2>${t}</h2><p class="d">${d}</p><div class="rowf">
  ${!ONE || !/2$/.test(ONE) ? `<div><div class="ph ${bg}" id="f_${id}">${fn(bg === 'hg' ? S1 : B1)}${m ? MSG[m] : ''}</div><p class="cap">${bg === 'hg' ? 'F-4, ранг I: две подвески' : 'начало вылета'}</p></div>` : ''}
  ${!ONE || /2$/.test(ONE) ? `<div><div class="ph ${bg} cr" id="f_${id}2">${fn(bg === 'hg' ? S2 : B2)}</div><p class="cap">${bg === 'hg' ? 'ранг II: три вида оружия с контейнером и закрытая подвеска' : 'контейнер, перезарядка, мало топлива, повреждение'}</p></div>` : ''}</div>`).join('');
if (!ONE && (!SEC || SEC === 't')) app.insertAdjacentHTML('beforeend', `<h1>«Табло»: читаемость приборов</h1><p class="d">Было: мелкие серо-оливковые подписи на полупрозрачной плите, на светлом небе плита сереет и подписи теряются. Три способа это убрать. Во всех плита темнее и плотнее, цифры чисто белые и чуть крупнее.</p><div class="cmp">${
  [['', 'Было'], ['b1', 'а · светлые подписи'], ['b2', 'б · золотые подписи'], ['b3', 'в · без слов, с единицами']].map(([m, t]) => `<div><b class="t">${t}</b><div class="ph bt cr" id="f_t${m || '0'}">${hB(B1, m)}</div><div class="ph bt cr" style="margin-top:6px" id="f_t${m || '0'}2">${hB(B2, m)}</div></div>`).join('')}</div><p class="d" style="margin-top:8px">Сверху начало вылета, снизу тяжёлый случай: контейнер, перезарядка, мало топлива, повреждение.</p>`);
await document.fonts.ready; await Promise.all([...document.images].map((i) => i.decode().catch(() => {}))); window.__ready = true;
</script></body></html>
