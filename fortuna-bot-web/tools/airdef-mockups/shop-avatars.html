<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Магазин: аватарки</title>
<style>
@font-face { font-family: 'Oswald'; font-weight: 300 700; src: url(../../games/airdef/fonts/oswald-cyrillic.woff2) format('woff2'); unicode-range: U+0400-045F, U+2116; }
@font-face { font-family: 'Oswald'; font-weight: 300 700; src: url(../../games/airdef/fonts/oswald-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
@font-face { font-family: 'Golos Text'; font-weight: 400 800; src: url(../../games/airdef/fonts/golos-text-cyrillic.woff2) format('woff2'); unicode-range: U+0400-045F; }
@font-face { font-family: 'Golos Text'; font-weight: 400 800; src: url(../../games/airdef/fonts/golos-text-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
:root { --amber: #e8b14a; --amber2: #f3c96f; --jade: #59b884; --ok: #8fcf7a; --dim: #d3d8cc; --mute: #a2aa98; --ease: cubic-bezier(.2,.8,.2,1); }
* { box-sizing: border-box; } body { margin: 0; background: #0d100c; color: #f3f0e6; font: 14px 'Golos Text', sans-serif; }
.bar { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 10px 16px; } .bar b { font: 500 17px 'Oswald'; } .sw { display: flex; gap: 4px; } .sw button { padding: 6px 12px; font: 500 14px 'Oswald'; color: #e9e6dc; background: #20261c; border: 1px solid #3a4532; cursor: pointer; } .sw button.on { background: var(--amber); color: #17190f; border-color: var(--amber); }
.note { padding: 0 16px 10px; max-width: 980px; color: var(--dim); line-height: 1.45; }
.stage { padding: 0 16px 24px; overflow: auto; }
#S { position: relative; overflow: hidden; isolation: isolate; background: #1b2026; --k: 1; }
#S.ph { --k: .78; }
.bgl { position: absolute; inset: 0; background: center / cover no-repeat; opacity: 0; transition: opacity .8s ease; z-index: -3; } .bgl.on { opacity: 1; }
.vign { position: absolute; inset: 0; z-index: -1; pointer-events: none; background: linear-gradient(180deg, rgba(10,12,14,.72) 0, rgba(10,12,14,0) 90px), linear-gradient(0deg, rgba(10,12,14,.7) 0, rgba(10,12,14,0) 120px), linear-gradient(90deg, rgba(10,12,14,.78) 0, rgba(10,12,14,.35) 30%, rgba(10,12,14,0) 48%); }
.top { position: absolute; left: calc(22px * var(--k) + var(--il)); right: calc(16px * var(--k) + var(--ir)); top: calc(10px * var(--k)); display: flex; align-items: center; gap: calc(8px * var(--k)); z-index: 5; }
.top h1 { margin: 0 calc(10px * var(--k)) 0 0; font: 500 calc(22px * var(--k))/1 'Oswald'; }
.cats { display: flex; margin-right: auto; } .cats button { height: calc(36px * var(--k)); padding: 0 calc(14px * var(--k)); font: 500 calc(15px * var(--k)) 'Oswald'; letter-spacing: .02em; color: var(--dim); background: rgba(14,17,15,.72); border: 1px solid #3a4532; border-right-width: 0; cursor: pointer; display: flex; align-items: center; gap: calc(6px * var(--k)); } .cats button:last-child { border-right-width: 1px; } .cats button.on { background: var(--amber); color: #17190f; border-color: var(--amber); } .cats small { font: 500 calc(11px * var(--k)) 'Golos Text'; opacity: .8; }
.bal, .sq { height: calc(38px * var(--k)); display: flex; align-items: center; background: rgba(14,17,15,.82); border: 1px solid #3a4532; } .bal { gap: calc(7px * var(--k)); padding: 0 calc(12px * var(--k)); font: 600 calc(16px * var(--k)) 'Oswald'; } .bal img { width: calc(24px * var(--k)); height: calc(24px * var(--k)); } .sq { width: calc(38px * var(--k)); justify-content: center; font: 600 calc(17px * var(--k)) 'Oswald'; color: var(--amber2); }
.gem { display: inline-flex; align-items: center; gap: .25em; font-weight: 600; } .gem img { width: 1.25em; height: 1.25em; }
.btn { display: inline-flex; align-items: center; gap: calc(8px * var(--k)); height: calc(44px * var(--k)); padding: 0 calc(22px * var(--k)); background: var(--amber); color: #17190f; font: 500 calc(18px * var(--k)) 'Oswald'; border: 0; clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%); cursor: pointer; white-space: nowrap; } .btn.ok { background: rgba(14,17,15,.84); color: var(--ok); box-shadow: inset 0 0 0 1px #3f5a35; clip-path: none; }
.kick { font-size: calc(13px * var(--k)); color: var(--dim); } .name { margin: calc(4px * var(--k)) 0 calc(10px * var(--k)); font: 600 calc(40px * var(--k))/1 'Oswald'; color: var(--amber2); text-shadow: 0 2px 16px rgba(0,0,0,.55); }
.frame { display: block; object-fit: cover; box-shadow: 0 0 0 calc(2px * var(--k)) #e8b14a, 0 calc(10px * var(--k)) calc(26px * var(--k)) rgba(0,0,0,.55); }
.seen { margin-top: calc(12px * var(--k)); padding: calc(6px * var(--k)) calc(10px * var(--k)); display: flex; align-items: center; gap: calc(9px * var(--k)); background: rgba(14,17,15,.84); border: 1px solid #333d2c; font-size: calc(12.5px * var(--k)); } .seen img { width: calc(34px * var(--k)); height: calc(34px * var(--k)); box-shadow: 0 0 0 1px rgba(232,177,74,.7); } .seen b { font: 500 calc(15px * var(--k)) 'Oswald'; display: block; } .seen small { color: var(--mute); }
.seenT { margin-top: calc(10px * var(--k)); font-size: calc(11.5px * var(--k)); color: var(--mute); }
.tile { position: relative; padding: calc(4px * var(--k)); background: rgba(14,17,15,.84); border: 1px solid #333d2c; cursor: pointer; color: inherit; text-align: left; font: inherit; display: block; } .tile img.p { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; filter: saturate(.85) brightness(.88); transition: filter .25s; } .tile.on { border-color: #55614a; background: rgba(26,31,24,.94); } .tile.on img.p, .tile:hover img.p { filter: none; } .tile::before { content: ''; position: absolute; left: -1px; right: -1px; top: -1px; height: calc(3px * var(--k)); background: var(--amber); transform: scaleX(0); transform-origin: left; transition: transform .3s var(--ease); z-index: 1; } .tile.on::before { transform: scaleX(1); }
.tile .pr { display: flex; justify-content: center; align-items: center; gap: .3em; padding-top: calc(3px * var(--k)); font: 500 calc(12.5px * var(--k)) 'Oswald'; color: var(--dim); white-space: nowrap; } .tile .pr.got { color: var(--ok); }
/* B · Картотека */
.bL { position: absolute; left: calc(22px * var(--k) + var(--il)); top: calc(62px * var(--k)); width: calc(300px * var(--k)); z-index: 4; }
.bL .frame { width: calc(190px * var(--k)); height: calc(190px * var(--k)); margin: calc(6px * var(--k)) 0 calc(10px * var(--k)); }
.bG { position: absolute; z-index: 4; left: calc(340px * var(--k) + var(--il)); right: calc(16px * var(--k) + var(--ir)); top: calc(62px * var(--k)); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: calc(8px * var(--k)); align-content: start; }
#S.ph .bL .frame { width: 92px; height: 92px; float: left; margin: 2px 10px 6px 2px; } #S.ph .bL { width: 250px; top: 50px; } #S.ph .name { font-size: 22px; margin-top: 2px; } #S.ph .bG { left: calc(268px + var(--il)); top: 50px; gap: 5px; } #S.ph .btn { height: 32px; font-size: 14px; padding: 0 12px; clear: both; } #S.ph .seen { clear: both; margin-top: 8px; padding: 4px 8px; } #S.ph .seenT { display: none; } #S.ph .tile { padding: 2px; }
/* A · Как окраски */
.aL { position: absolute; left: calc(22px * var(--k) + var(--il)); top: calc(70px * var(--k)); width: calc(340px * var(--k)); z-index: 4; }
.aH { position: absolute; z-index: 3; right: calc(90px * var(--k) + var(--ir)); top: calc(60px * var(--k)); width: calc(430px * var(--k)); height: calc(430px * var(--k)); } #S.ph .aH { width: 214px; height: 214px; right: calc(70px + var(--ir)); top: 50px; }
.aT { position: absolute; z-index: 4; left: calc(22px * var(--k) + var(--il)); right: calc(16px * var(--k) + var(--ir)); bottom: calc(12px * var(--k) + var(--ib)); display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: calc(6px * var(--k)); } #S.ph .aT .pr { font-size: 9.5px; } #S.ph .aT .tile { padding: 2px; } #S.ph .aL { top: 50px; } #S.ph .aL .name { font-size: 24px; } #S.ph .btn { height: 34px; font-size: 14px; padding: 0 12px; }
/* C · Единая лента */
.cR { position: absolute; z-index: 4; left: calc(22px * var(--k) + var(--il)); right: calc(16px * var(--k) + var(--ir)); bottom: calc(12px * var(--k) + var(--ib)); display: grid; grid-template-columns: auto 1fr; gap: calc(6px * var(--k)) calc(10px * var(--k)); align-items: center; } .cR .lb { font: 500 calc(13px * var(--k)) 'Oswald'; color: var(--dim); } .cR .rw { display: flex; gap: calc(6px * var(--k)); overflow: hidden; } .cR .tile { flex: 0 0 calc(70px * var(--k)); padding: 2px; } .cR .tile.w { flex: 0 0 calc(124px * var(--k)); } .cR .tile.w img.p { aspect-ratio: 16 / 9; } .cR .pr { display: none; }
#S.ph .cR .tile { flex-basis: 50px; } #S.ph .cR .tile.w { flex-basis: 88px; }
.ctop { position: absolute; left: calc(22px * var(--k) + var(--il)); right: calc(16px * var(--k) + var(--ir)); top: calc(10px * var(--k)); }
</style></head><body>
<div class="bar"><b>Магазин: раздел «Аватарки»</b><span class="sw" id="vs"><button data-v="B">B · Картотека</button><button data-v="A">A · Как окраски</button><button data-v="C">C · Единая лента</button></span><span class="sw" id="fs"><button data-f="pc">Компьютер</button><button data-f="ph">Телефон</button></span><span class="sw" id="cs"><button data-c="ava">Аватарки</button><button data-c="camo">Окраски</button></span></div>
<div class="note" id="note"></div><div class="stage"><div id="S"><div class="bgl"></div><div class="bgl"></div><div class="vign"></div><div id="ui"></div></div></div>
<script>
const G = '../../games/airdef/', GEM = G + 'ui/quests/t_gems.webp', A = (i) => `shop-avatars/ava_${String(i).padStart(2, '0')}.webp`;
const AV = [[1, 'Перехват', 'МиГ-31 над облаками'], [2, 'Снежная рулёжка', 'Су-57'], [3, 'Вечерний хищник', 'F-22'], [4, 'Вираж', 'F-15E'], [5, 'Сумерки', 'Ка-52'], [6, 'Пыльная буря', 'AH-64'], [7, 'Ночной дозор', 'С-400'], [8, 'Туман', 'Patriot'], [9, 'Пуск', 'Панцирь'], [10, 'Старт', 'Баллистическая ракета']];
const CAMO = [['e_f15e_inferno', 'Инферно', 'F-15E'], ['e_mig31_dragon', 'Нефритовый дракон', 'МиГ-31БМ']];
const NOTE = { B: '<b>B · Картотека (предлагаю).</b> Все 10 аватарок видны сразу, ничего не листается. Слева большая выбранная, цена и кнопка, ниже — как она выглядит рядом с ником. Вкладки «Окраски / Аватарки» вверху, фон плавно сменяется. Окраски остаются своей витриной с самолётом и небом.', A: '<b>A · Как окраски.</b> Та же витрина: название и кнопка слева, большая картинка справа, плитки внизу. Единообразно, но 10 плиток в ряд на телефоне мелкие: картинка в плитке около 60 px.', C: '<b>C · Единая лента.</b> Без вкладок: снизу два ряда, окраски и аватарки, большая картинка и фон меняются по выбору. Всё на одном экране, но на телефоне два ряда съедают половину высоты, и экран выглядит тесно.' };
let V = 'B', F = 'pc', C = 'ava', sel = 0, camo = 1, bn = 0, shown = '';
const OWN = 3, WORN = 7, BAL = 46; // примерное состояние для показа: куплена, надета
const S = document.getElementById('S'), ui = document.getElementById('ui'), bgs = S.querySelectorAll('.bgl');
const setBg = (u) => { if (u === shown) return; shown = u; bn ^= 1; bgs[bn].style.backgroundImage = `url(${u})`; bgs[bn].classList.add('on'); bgs[bn ^ 1].classList.remove('on'); };
const price = (i) => i === WORN ? '<span class="pr got">надета</span>' : i === OWN ? '<span class="pr got">куплена</span>' : `<span class="pr"><span class="gem"><img src="${GEM}" alt="">20</span></span>`;
const action = (i) => i === WORN ? '<span class="btn ok">Надета</span>' : i === OWN ? '<button class="btn">Надеть</button>' : `<button class="btn">Купить <span class="gem"><img src="${GEM}" alt="">20</span></button>`;
const seen = (i) => `<div class="seenT">Так вас увидят в рейтинге и в онлайне:</div><div class="seen"><img src="${A(AV[i][0])}" alt=""><span><b>xFORTUNAx</b><small>12 место · 1 840 очков</small></span></div>`;
const topBar = (tabs = true) => `<div class="top"><h1>Магазин</h1><div class="cats" style="${tabs ? '' : 'visibility:hidden'}"><button data-c="camo" class="${C === 'camo' ? 'on' : ''}">Окраски <small>2</small></button><button data-c="ava" class="${C === 'ava' ? 'on' : ''}">Аватарки <small>10</small></button></div><div class="bal"><img src="${GEM}" alt="">${BAL}</div><div class="sq">?</div><div class="sq">×</div></div>`;
const tiles = (cl = '') => AV.map(([n], i) => `<button class="tile ${i === sel ? 'on' : ''} ${cl}" data-s="${i}"><img class="p" src="${A(n)}" alt="">${price(i)}</button>`).join('');
const camoPoster = () => { const [k, nm, pl] = CAMO[camo]; return `<div class="aL"><div class="kick">${pl}</div><h2 class="name" style="font-size:calc(52px * var(--k))">${nm}</h2><button class="btn">Купить <span class="gem"><img src="${GEM}" alt="">150</span></button></div><img src="${G}shop/${k}.webp" alt="" style="position:absolute;z-index:3;right:calc(10px + var(--ir));top:6%;width:68%;">`; };
const camoTiles = (cl = '') => CAMO.map(([k, nm], i) => `<button class="tile w ${i === camo && C === 'camo' ? 'on' : ''} ${cl}" data-k="${i}" style="${cl ? '' : 'width:calc(190px * var(--k))'}"><img class="p" src="${G}shop/${k}_s.webp" alt="" style="aspect-ratio:16/9"><span class="pr"><span class="gem"><img src="${GEM}" alt="">150</span></span></button>`).join('');
function draw() {
  const [W, H, il, ir, ib] = F === 'pc' ? [1280, 720, 0, 0, 0] : [874, 402, 47, 47, 21]; S.className = F === 'ph' ? 'ph' : ''; S.style.width = W + 'px'; S.style.height = H + 'px'; S.style.setProperty('--il', il + 'px'); S.style.setProperty('--ir', ir + 'px'); S.style.setProperty('--ib', ib + 'px');
  document.getElementById('note').innerHTML = NOTE[V];
  document.querySelectorAll('#vs button').forEach((b) => b.classList.toggle('on', b.dataset.v === V)); document.querySelectorAll('#fs button').forEach((b) => b.classList.toggle('on', b.dataset.f === F)); document.querySelectorAll('#cs button').forEach((b) => b.classList.toggle('on', b.dataset.c === C));
  setBg(C === 'ava' ? G + 'ui/quests/bg.jpg' : `${G}shop/${CAMO[camo][0]}_sky.webp`);
  const a = AV[sel];
  if (C === 'camo' && V !== 'C') { ui.innerHTML = topBar() + camoPoster() + `<div style="position:absolute;z-index:4;left:calc(22px * var(--k) + var(--il));bottom:calc(12px * var(--k) + var(--ib));display:flex;gap:8px">${camoTiles()}</div>`; return; }
  if (V === 'B') ui.innerHTML = topBar() + `<div class="bL"><div class="kick">${a[2]}</div><img class="frame" src="${A(a[0])}" alt=""><h2 class="name">${a[1]}</h2>${action(sel)}${seen(sel)}</div><div class="bG">${tiles()}</div>`;
  else if (V === 'A') ui.innerHTML = topBar() + `<div class="aL"><div class="kick">${a[2]}</div><h2 class="name">${a[1]}</h2>${action(sel)}${F === 'pc' ? seen(sel) : ''}</div><img class="aH frame" src="${A(a[0])}" alt=""><div class="aT">${tiles()}</div>`;
  else { const isC = C === 'camo'; ui.innerHTML = topBar(false) + (isC ? camoPoster() : `<div class="aL"><div class="kick">${a[2]}</div><h2 class="name">${a[1]}</h2>${action(sel)}</div><img class="aH frame" src="${A(a[0])}" alt="" style="${F === 'pc' ? 'width:calc(330px * var(--k));height:calc(330px * var(--k))' : 'width:150px;height:150px'}">`) + `<div class="cR"><span class="lb">Окраски</span><div class="rw">${camoTiles('w')}</div><span class="lb">Аватарки</span><div class="rw">${tiles()}</div></div>`; }
}
document.addEventListener('click', (e) => { const b = e.target.closest('[data-v],[data-f],[data-c],[data-s],[data-k]'); if (!b) return; const d = b.dataset; if (d.v) V = d.v; if (d.f) F = d.f; if (d.c) C = d.c; if (d.s) { sel = +d.s; C = 'ava'; } if (d.k) { camo = +d.k; C = 'camo'; } draw(); });
try { const h = location.hash.slice(1).split('-'); if (NOTE[h[0]]) V = h[0]; if (h[1]) F = h[1]; if (h[2]) C = h[2]; } catch (_) {}
draw();
</script></body></html>
