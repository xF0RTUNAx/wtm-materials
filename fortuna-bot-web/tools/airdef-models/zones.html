<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Зоны повреждений</title>
<style>body{margin:0;background:#1d232b;font:13px sans-serif;color:#dde}#l{position:fixed;left:8px;top:6px}</style></head>
<body><div id="l"></div>
<!-- Проверка нарезки самолётов на зоны (games/airdef/plane-zones.js): сверху вид сверху, снизу — сбоку и спереди.
     Серый — фюзеляж, синий/голубой — левое крыло и его консоль, красный/розовый — правое, хвост: жёлтый — левый борт,
     оранжевый — правый, салатовый — середина (одиночный киль); зелёные точки — сопла. ?cut=1 — оторваны левая консоль и левая половина хвоста
     ?m=su30,f16,… — модели (по 1 в строке) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">
import { loadModels, wantModel, anyModel, planeMeta } from '../../games/airdef/models.js?v=20261022q';
import { splitPlane } from '../../games/airdef/plane-zones.js?v=20261022q';
import { planeDamageVis } from '../../games/airdef/plane-damage.js?v=20261022q';
const Q = new URLSearchParams(location.search), LIST = (Q.get('m') || 'su30').split(',');
const CW = Q.get('big') ? 1000 : 420, CH = Q.get('big') ? 640 : 300, r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(CW * 3, CH * LIST.length); r.setScissorTest(true); r.outputEncoding = THREE.sRGBEncoding; document.body.appendChild(r.domElement);
const COL = { body: 0x8d939a, wingL: 0x2f6fe0, consL: 0x8fd0ff, wingR: 0xe0402f, consR: 0xffa8a0, tailL: 0xf2c230, tailR: 0xe08a20, tailC: 0xb0e040 };
loadModels(new URL('../../games/airdef/', location.href).href, () => {}); for (const m of LIST) wantModel(m);
const info = [];
for (const [row, M] of LIST.entries()) {
  let A = null; for (let i = 0; i < 400 && !(A = anyModel(M)); i++) await new Promise((res) => setTimeout(res, 100));
  if (!A) { info.push(M + ': нет'); continue; }
  const B = A.clone(true); B.updateMatrixWorld(true); const HOLES = Q.get('holes'); // ?holes=1 — пробоины: левое крыло сильно, хвост и баки средне
  const { P } = HOLES ? (() => { const dv = planeDamageVis(new THREE.Scene(), B, M, planeMeta(M), null); dv.sync({ dz: { wingL: 0.35, wingR: 0.85, tail: 0.55, eng: [0.6, 0.9], fuel: 0.6 }, det: { consL: false, consR: false, tailL: false, tailR: false, tailAll: false } }); return dv; })() : splitPlane(B, M, planeMeta(M));
  const CUT = Q.get('cut') || HOLES; // ?cut=1 — в своих текстурах, левая консоль и хвост оторваны (как в игре)
  if (CUT && !HOLES) B.traverse((o) => { if (o.isMesh && (o.userData.zone === 'consL' || o.userData.zone === 'tailL')) o.visible = false; if (o.isMesh && o.userData.zone === 'scarL') o.visible = true; });
  else if (!CUT) B.traverse((o) => { if (o.isMesh) o.material = new THREE.MeshLambertMaterial({ color: COL[o.userData.zone] || 0xffffff, side: THREE.DoubleSide }); });
  const sc = new THREE.Scene(); sc.background = new THREE.Color(CUT ? 0x8fa3b8 : 0x1d232b); sc.add(new THREE.HemisphereLight(0xffffff, 0x404040, 0.9)); const dl = new THREE.DirectionalLight(0xffffff, 0.6); dl.position.set(-2, 5, 3); sc.add(dl); sc.add(B);
  const meta = planeMeta(M);
  if (!CUT && meta && meta.nozzles) for (const n of meta.nozzles) { const s = new THREE.Mesh(new THREE.SphereGeometry(Math.max(0.3, P.L * 0.02), 8, 6), new THREE.MeshBasicMaterial({ color: 0x30ff60 })); s.position.copy(n); sc.add(s); }
  const bb = new THREE.Box3().setFromObject(B), c = bb.getCenter(new THREE.Vector3()), s = bb.getSize(new THREE.Vector3()).length() * 0.55;
  const views = CUT ? [[0, 1, 0.001], [-0.8, 0.45, 0.6], [0.8, 0.35, -0.7]] : [[0, 1, 0.001], [1, 0.05, 0], [0.0, 0.15, -1]];
  views.forEach(([x, y, z], i) => { const cam = new THREE.OrthographicCamera(-s * CW / CH, s * CW / CH, s, -s, 0.1, s * 10); cam.position.copy(c).add(new THREE.Vector3(x, y, z).normalize().multiplyScalar(s * 4)); if (i === 0) cam.up.set(0, 0, -1); cam.lookAt(c);
    const y0 = (LIST.length - 1 - row) * CH; r.setViewport(i * CW, y0, CW, CH); r.setScissor(i * CW, y0, CW, CH); r.render(sc, cam); });
  { const bb2 = new THREE.Box3().setFromObject(B); info.push(`${M}: фюз ±${P.fus.toFixed(1)} м, хвост с ${(P.tailZ - P.z0).toFixed(1)} из ${P.L.toFixed(1)} м, консоль с ${P.consX.toFixed(1)} из ${P.xm.toFixed(1)}, верх ${P.top.toFixed(2)}, y ${bb2.min.y.toFixed(1)}…${bb2.max.y.toFixed(1)}`); }
}
document.getElementById('l').innerHTML = info.join('<br>');
window.__info = info; window.__ok = 1;
</script></body></html>
