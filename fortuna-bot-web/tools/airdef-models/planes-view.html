<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Самолёты: сопла и вид снизу</title>
<style>body{margin:0;background:#9fb3c8;font:12px sans-serif}canvas{display:block}.l{position:absolute;color:#000;background:rgba(255,255,255,.7);padding:1px 4px}</style></head>
<body>
<!-- Проверка готовых моделей самолётов тем же загрузчиком, что в игре (models.js): ?p=e_tu16,e_su35 — по строке на самолёт:
     сзади-сверху с пламенем форсажа, строго сзади, сбоку (хвост), снизу. Красные точки — сопла из META (поверх модели).
     &nz=x,y,z;x,y,z — проверить другие сопла (для первого самолёта). Нужен сервер :8935 (корень — wtm-materials). -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">
const Q = new URLSearchParams(location.search), names = (Q.get('p') || 'e_tu16').split(',');
const M = await import('../../games/airdef/models.js?v=' + Date.now());
const { attachFlames } = await import('../../games/airdef/units-render.js?v=20261022l');
M.loadModels('../../games/airdef/', () => {});
const CW = +(Q.get("w") || 200), CH = Math.round(CW * 0.7), W = CW * 4, H = CH * names.length;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(W, H); r.setScissorTest(true); r.outputEncoding = THREE.sRGBEncoding; document.body.appendChild(r.domElement);
const wait = (n) => new Promise((ok) => { M.wantModel(n); const t = setInterval(() => { const o = M.anyModel(n); if (o) { clearInterval(t); ok(o); } }, 50); });
for (let i = 0; i < names.length; i++) {
  const n = names[i], obj = await wait(n), meta = M.planeMeta(n);
  const nzs = i === 0 && Q.get('nz') ? Q.get('nz').split(';').map((s) => new THREE.Vector3(...s.split(',').map(Number))) : meta.nozzles;
  const sc = new THREE.Scene(); sc.background = new THREE.Color(Q.get("bg") ? +("0x" + Q.get("bg")) : 0x9fb3c8);
  sc.add(new THREE.HemisphereLight(0xffffff, 0x556655, 0.9)); const dl = new THREE.DirectionalLight(0xffffff, 0.8); dl.position.set(3, 6, 2); sc.add(dl);
  sc.add(obj); const fl = attachFlames(obj, nzs, meta.nr / 0.45, true); fl.update(Q.get('ab') === '1' ? 1 : 0.4, Q.get('ab') === '1');
  for (const p of nzs) { const d = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 8), new THREE.MeshBasicMaterial({ color: 0xff0000, depthTest: false })); d.renderOrder = 9; d.position.copy(p); sc.add(d); }
  const b = new THREE.Box3().setFromObject(obj), c = b.getCenter(new THREE.Vector3()), L = b.max.z - b.min.z, S = Math.max(L, b.max.x - b.min.x);
  // крупно — у сопел (середина точек), размер кадра — по их разносу
  const tail = nzs.length ? nzs.reduce((a, p) => a.add(p), new THREE.Vector3()).divideScalar(nzs.length) : new THREE.Vector3(c.x, c.y, b.max.z - L * 0.15);
  const d = Math.max(2.2, Math.max(0, ...nzs.map((p) => Math.abs(p.x))) * 2 + 2.2);
  const views = [
    [new THREE.PerspectiveCamera(35, CW / CH, 0.05, 500), tail.clone().add(new THREE.Vector3(d * 0.9, d * 0.5, Math.max(d * 1.6, b.max.z - tail.z + d * 0.8))), tail],
    [new THREE.PerspectiveCamera(35, CW / CH, 0.05, 500), new THREE.Vector3(tail.x + 0.01, tail.y + 0.15, Math.max(tail.z + d * 2.4, b.max.z + d * 1.2)), tail],
    [new THREE.PerspectiveCamera(30, CW / CH, 0.05, 500), tail.clone().add(new THREE.Vector3(d * 2.6, 0, -d * 0.3)), tail],
    [new THREE.PerspectiveCamera(40, CW / CH, 0.05, 500), c.clone().add(new THREE.Vector3(S * 0.25, -S * 1.1, S * 0.35)), c],
  ];
  // &ortho=1 — сзади, сбоку, снизу без перспективы, с сеткой: тонкие линии — 0,5 м, толстые — 1 м, красные — ноль осей
  if (Q.get('ortho')) {
    const h = +(Q.get('h') || d), at = Q.get('at') ? new THREE.Vector3(...Q.get('at').split(',').map(Number)) : tail, oc = () => new THREE.OrthographicCamera(-h * CW / CH, h * CW / CH, h, -h, 0.01, 400);
    const grid = (axA, axB, fix) => { const g = new THREE.Group(); for (let v = -40; v <= 40; v += 0.5) for (const ax of [0, 1]) {
      const a = new THREE.Vector3(), b = new THREE.Vector3(); a[[axA, axB][ax]] = v; b[[axA, axB][ax]] = v; a[[axB, axA][ax]] = -40; b[[axB, axA][ax]] = 40; a[fix[0]] = b[fix[0]] = fix[1];
      const col = v === 0 ? 0xff0000 : v % 1 === 0 ? 0x000000 : 0x666666; const ln = new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]), new THREE.LineBasicMaterial({ color: col, transparent: true, opacity: v % 1 === 0 ? 0.55 : 0.25, depthTest: false })); ln.renderOrder = 8; g.add(ln); } return g; };
    const gR = grid('x', 'y', ['z', 50]), gS = grid('z', 'y', ['x', 50]), gB = grid('x', 'z', ['y', -50]);
    views.length = 0;
    views.push([oc(), new THREE.Vector3(at.x, at.y, 60), at, gR], [oc(), new THREE.Vector3(60, at.y, at.z), at, gS], [oc(), new THREE.Vector3(at.x, -60, at.z + 0.001), at, gB]);
  }
  views.forEach(([cam, pos, at, gr], k) => { if (gr) sc.add(gr); requestAnimationFrame(() => {}); 
    cam.position.copy(pos); cam.lookAt(at);
    const y = H - (i + 1) * CH; r.setViewport(k * CW, y, CW, CH); r.setScissor(k * CW, y, CW, CH); r.render(sc, cam); if (gr) sc.remove(gr);
  });
  const l = document.createElement('div'); l.className = 'l'; l.style.left = '2px'; l.style.top = i * CH + 'px'; l.textContent = n + ' · ' + nzs.map((p) => p.toArray().map((v) => +v.toFixed(2)).join(',')).join(' ; '); document.body.appendChild(l);
}
window.__ok = 1;
</script></body></html>
