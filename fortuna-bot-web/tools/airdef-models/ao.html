<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Затенение моделей</title>
<style>body{margin:0;background:#9fb3c8;font:13px sans-serif}#l{position:fixed;left:8px;top:6px}</style></head>
<body><div id="l"></div>
<!-- Модель игры как в игре (models.js): слева — без затенения в стыках, справа — с ним (tools/airdef-models/ao.js).
     ?m=s400 — имя модели, &az=0.8 — угол обзора (рад), &el=0.25 — высота взгляда, &k=1 — дальность -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">
import { loadModels, wantModel, anyModel } from '../../games/airdef/models.js?v=20261022w';
const Q = new URLSearchParams(location.search), M = Q.get('m') || 's400', AZ = +(Q.get('az') || 0.8), EL = +(Q.get('el') || 0.25), K = +(Q.get('k') || 1);
const W = 1400, H = 560, r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(W, H); r.setScissorTest(true); r.outputEncoding = THREE.sRGBEncoding; document.body.appendChild(r.domElement);
loadModels(new URL('../../games/airdef/', location.href).href, () => {}); wantModel(M);
let A = null; for (let i = 0; i < 400 && !(A = anyModel(M)); i++) await new Promise((res) => setTimeout(res, 100));
if (!A) { document.getElementById('l').textContent = 'модель не загрузилась'; throw new Error('нет модели'); }
const B = A.clone(true); let has = false;
B.traverse((o) => { if (o.isMesh) { o.material = o.material.clone(); has = has || o.material.vertexColors; o.material.vertexColors = false; o.material.needsUpdate = true; } });
document.getElementById('l').textContent = `${M}: слева — без затенения, справа — ${has ? 'с затенением в стыках' : 'затенения в модели нет'}`;
const sc = new THREE.Scene(); sc.background = new THREE.Color(0x9fb3c8);
sc.add(new THREE.HemisphereLight(0xdfe8f5, 0x5a5448, 0.75)); const dl = new THREE.DirectionalLight(0xfff4e6, 1.1); dl.position.set(-3, 6, 4); sc.add(dl);
const bb = new THREE.Box3().setFromObject(A), c = bb.getCenter(new THREE.Vector3()), s = bb.getSize(new THREE.Vector3()).length() * 0.6;
[B, A].forEach((G, i) => { sc.children.filter((x) => x.isGroup || x.isObject3D && x.type === 'Group').forEach((x) => sc.remove(x)); sc.add(G);
  const cam = new THREE.PerspectiveCamera(30, (W / 2) / H, 0.1, 5000); cam.position.copy(c).add(new THREE.Vector3(Math.sin(AZ) * Math.cos(EL), Math.sin(EL), Math.cos(AZ) * Math.cos(EL)).multiplyScalar(s * 3.2 * K)); cam.lookAt(c);
  r.setViewport(i * W / 2, 0, W / 2, H); r.setScissor(i * W / 2, 0, W / 2, H); r.render(sc, cam); });
window.__ok = 1;
</script></body></html>
