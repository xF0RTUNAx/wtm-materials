<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Воздушное превосходство — кадры для фона меню (на утверждение)</title>
<style>
:root{color-scheme:dark;--bg:#0d1117;--card:#161b22;--tx:#e6edf3;--mut:#8b949e;--ac:#f0a030}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:20px 16px 8px;max-width:1500px;margin:auto}h1{margin:0 0 6px;font-size:22px}header p{margin:0;color:var(--mut)}
.bar{display:flex;flex-wrap:wrap;gap:8px;max-width:1500px;margin:0 auto;padding:8px 16px}
.bar button{background:var(--card);color:var(--tx);border:1px solid #30363d;border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer}
.bar button.on{border-color:var(--ac);color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px;max-width:1500px;margin:auto;padding:8px 16px 40px}
figure{margin:0;background:var(--card);border-radius:10px;overflow:hidden;cursor:zoom-in;border:1px solid #21262d}
figure img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#000}
figcaption{padding:10px 12px 12px}.nm{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.nm b{color:var(--ac);font-size:18px}.nm code{color:var(--mut);font-size:12px;word-break:break-all}.mp{color:var(--mut);font-size:12px;margin-left:auto}
figcaption p{margin:4px 0 0}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:9;padding:8px}
#lb.on{display:flex}#lb img{max-width:100%;max-height:calc(100% - 70px);object-fit:contain}#lb div{color:#fff;padding:10px 12px 2px;text-align:center;max-width:900px}
#lb small{color:var(--mut);display:block;margin-top:2px}
@media(max-width:560px){.grid{grid-template-columns:1fr;padding:8px 12px 40px;gap:12px}header{padding:16px 12px 6px}h1{font-size:19px}.bar{padding:8px 12px}}
</style></head><body>
<header><h1>Кадры для фона главного меню — на утверждение</h1><p>58 кадров, 1920×1080; «-v2» — переснятые слабые. Нажмите на кадр — на весь экран (стрелки и свайп — следующий, Esc — закрыть). Запишите номера, которые войдут в игру.</p></header>
<div class="bar" id="bar"></div><div class="grid" id="g"></div>
<div id="lb"><img id="li" alt=""><div id="lc"></div></div>
<script>
const D=[{"n":1,"f":"01-mig23-city.webp","cap":"МиГ-23БН (восток) низко над городом, утро, сбоку","map":"Город"},{"n":2,"f":"02-f4-evening.webp","cap":"F-4 Phantom (запад) с Shrike, вечер, спереди","map":"Город"},{"n":3,"f":"03-su25-kh29.webp","cap":"Х-29Т после пуска, закат, сзади","map":"Город"},{"n":4,"f":"04-a10-maverick.webp","cap":"A-10A и Maverick, пасмурно, сбоку","map":"Город"},{"n":5,"f":"05-tornado-front.webp","cap":"Tornado, утро, спереди","map":"Город"},{"n":5,"f":"05-tornado-morning.webp","cap":"Tornado, сзади","map":"Город"},{"n":6,"f":"06-f15e-low.webp","cap":"F-15E низко над городом, закат","map":"Город"},{"n":6,"f":"06-f15e-sunset.webp","cap":"F-15E, закат, сзади","map":"Город"},{"n":7,"f":"07-b52-below.webp","cap":"B-52H снизу на фоне неба, день","map":"Город"},{"n":8,"f":"08-tu95-far-v2.webp","cap":"Ту-95МС сбоку, крупно, утро","map":"Город"},{"n":8,"f":"08-tu95-far.webp","cap":"Ту-95МС пролётом, утро","map":"Город"},{"n":8,"f":"08-tu95-front.webp","cap":"Ту-95МС, утро","map":"Город"},{"n":9,"f":"09-su57-front-v2.webp","cap":"Су-57 спереди, утро","map":"Город"},{"n":9,"f":"09-su57-front.webp","cap":"Су-57 спереди, закат","map":"Город"},{"n":9,"f":"09-su57-side.webp","cap":"Су-57 над окраиной, закат","map":"Город"},{"n":10,"f":"10-patriot-sunset.webp","cap":"Пуск Patriot, закат","map":"Город"},{"n":11,"f":"11-shilka-day.webp","cap":"ЗСУ-23-4 «Шилка», очередь","map":"Город"},{"n":12,"f":"12-shahed-city-v2.webp","cap":"Дрон над городом, крупно","map":"Город"},{"n":12,"f":"12-shahed-city.webp","cap":"Дрон над городом","map":"Город"},{"n":13,"f":"13-buk-city.webp","cap":"Бук-М1, пуск","map":"Город"},{"n":14,"f":"14-f22-clear.webp","cap":"F-22 сбоку, ясно","map":"Северный рубеж"},{"n":15,"f":"15-f117-frost.webp","cap":"F-117A сверху, мороз","map":"Северный рубеж"},{"n":15,"f":"15-f117-low-v2.webp","cap":"F-117A над заснеженной равниной, крупнее","map":"Северный рубеж"},{"n":15,"f":"15-f117-low.webp","cap":"F-117A над заснеженной равниной, мороз","map":"Северный рубеж"},{"n":16,"f":"16-su34-umpk.webp","cap":"Су-34 и УМПК, снегопад","map":"Северный рубеж"},{"n":17,"f":"17-tu160-kh101.webp","cap":"Ту-160 пускает Х-101","map":"Северный рубеж"},{"n":18,"f":"18-b1b-tomahawk.webp","cap":"Tomahawk над снегом","map":"Северный рубеж"},{"n":19,"f":"19-shahed-snow.webp","cap":"Дрон, снегопад","map":"Северный рубеж"},{"n":20,"f":"20-kalibr-front.webp","cap":"Калибр спереди","map":"Северный рубеж"},{"n":21,"f":"21-pantsir-snow.webp","cap":"Панцирь, снег","map":"Северный рубеж"},{"n":22,"f":"22-pac3-frost.webp","cap":"PAC-3, пуск","map":"Северный рубеж"},{"n":23,"f":"23-kinzhal-chase.webp","cap":"МиГ-31К, Кинжал","map":"Северный рубеж"},{"n":24,"f":"24-harrier-frost.webp","cap":"Harrier GR.3 над снегом","map":"Северный рубеж"},{"n":25,"f":"25-su25-mount.webp","cap":"Су-25, камера на борту","map":"Северный рубеж"},{"n":26,"f":"26-mi24-dusk-v2.webp","cap":"Ми-24 ближе, на фоне неба","map":"Туманная топь"},{"n":26,"f":"26-mi24-dusk.webp","cap":"Ми-24","map":"Туманная топь"},{"n":27,"f":"27-ah64-fog-v2.webp","cap":"AH-64 ближе, светлый туман","map":"Туманная топь"},{"n":27,"f":"27-ah64-fog.webp","cap":"AH-64","map":"Туманная топь"},{"n":28,"f":"28-mi28-eve-v2.webp","cap":"Ми-28Н спереди, ближе","map":"Туманная топь"},{"n":28,"f":"28-mi28-eve.webp","cap":"Ми-28Н","map":"Туманная топь"},{"n":29,"f":"29-ka52-dusk.webp","cap":"Ка-52","map":"Туманная топь"},{"n":30,"f":"30-ah1-eve-v2.webp","cap":"AH-1W сбоку, на фоне неба","map":"Туманная топь"},{"n":30,"f":"30-ah1-eve.webp","cap":"AH-1W","map":"Туманная топь"},{"n":31,"f":"31-uh1-fog-v2.webp","cap":"UH-1H ближе, туман","map":"Туманная топь"},{"n":31,"f":"31-uh1-fog.webp","cap":"UH-1H","map":"Туманная топь"},{"n":32,"f":"32-su25-fog.webp","cap":"Су-25 над топью, туман","map":"Туманная топь"},{"n":33,"f":"33-mig27-dusk.webp","cap":"МиГ-27К сумерки","map":"Туманная топь"},{"n":34,"f":"34-a10-eve-v2.webp","cap":"A-10 над топью, вечер, сбоку","map":"Туманная топь"},{"n":34,"f":"34-a10-eve.webp","cap":"A-10 Maverick","map":"Туманная топь"},{"n":35,"f":"35-torm2-dusk.webp","cap":"Тор-М2 пуск","map":"Туманная топь"},{"n":36,"f":"36-shilka-fog-v2.webp","cap":"Шилка в тумане, крупно","map":"Туманная топь"},{"n":36,"f":"36-shilka-fog.webp","cap":"Шилка в тумане","map":"Туманная топь"},{"n":37,"f":"37-shahed-dusk-v2.webp","cap":"Дрон над топью, вечер, крупно","map":"Туманная топь"},{"n":37,"f":"37-shahed-dusk.webp","cap":"Дрон, сумерки","map":"Туманная топь"},{"n":38,"f":"38-church-dusk.webp","cap":"Монастырь на острове","map":"Туманная топь"},{"n":39,"f":"39-pumpkins-eve.webp","cap":"Тыквенное поле","map":"Туманная топь"},{"n":40,"f":"40-mill-dusk.webp","cap":"Мельница и РЛС на Лысой горе","map":"Туманная топь"},{"n":41,"f":"41-cemetery-fog.webp","cap":"Кладбище у деревни","map":"Туманная топь"}];
const g=document.getElementById('g'),lb=document.getElementById('lb'),li=document.getElementById('li'),lc=document.getElementById('lc');
let cur=[],idx=0,flt='';
function draw(){cur=D.filter(d=>!flt||d.map===flt);g.innerHTML=cur.map((d,i)=>'<figure data-i="'+i+'"><img loading="lazy" src="'+d.f+'" alt="'+d.n+'"><figcaption><div class="nm"><b>№'+d.n+'</b><code>'+d.f+'</code><span class="mp">'+d.map+'</span></div><p>'+d.cap.replace(/</g,'&lt;')+'</p></figcaption></figure>').join('')}
const maps=[...new Set(D.map(d=>d.map))];
document.getElementById('bar').innerHTML=['Все',...maps].map((m,i)=>'<button class="'+(i?'':'on')+'" data-m="'+(i?m:'')+'">'+m+'</button>').join('');
document.getElementById('bar').onclick=e=>{const b=e.target.closest('button');if(!b)return;flt=b.dataset.m;[...b.parentNode.children].forEach(x=>x.classList.toggle('on',x===b));draw()};
function show(i){idx=(i+cur.length)%cur.length;const d=cur[idx];li.src=d.f;lc.innerHTML='<b>№'+d.n+'</b> · '+d.cap.replace(/</g,'&lt;')+'<small>'+d.f+' · '+d.map+'</small>';lb.classList.add('on')}
g.onclick=e=>{const f=e.target.closest('figure');if(f)show(+f.dataset.i)};
lb.onclick=e=>{if(e.target===li){const r=li.getBoundingClientRect();show(idx+(e.clientX>r.left+r.width/2?1:-1))}else lb.classList.remove('on')};
addEventListener('keydown',e=>{if(!lb.classList.contains('on'))return;if(e.key==='Escape')lb.classList.remove('on');else if(e.key==='ArrowRight')show(idx+1);else if(e.key==='ArrowLeft')show(idx-1)});
let sx=0;lb.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});lb.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50){show(idx+(dx<0?1:-1));e.preventDefault()}});
draw();
</script></body></html>
