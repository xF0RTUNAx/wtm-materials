<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Запекание облаков</title>
<style>body{margin:0;background:#556;font:13px sans-serif;color:#fff}canvas{display:block;width:512px;height:512px;float:left;margin:4px}</style></head>
<body>
<!-- Объёмные облака → атлас 4×4 для игры (city-render.js buildClouds). Луч идёт сквозь объём (шары + шум), на выходе два RGB-атласа:
     clouds_n — свет сквозь объём от солнца справа / сверху / слева (RGB), clouds_d — R прозрачность, G свет от солнца
     за облаком (светятся тонкие края), B рассеянный свет неба. ?cell=512 — размер клетки, ?show=1 — превью освещения.
     Сохраняет tools/airdef-clouds/bake.js (puppeteer). Клетки 0–11 — кучевые, 12–15 — плоские слоисто-кучевые. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const Q = new URLSearchParams(location.search), CELL = +(Q.get('cell') || 512), N = 4, S = CELL * N;
// случайные формы: шары [x, y, z, r] в объёме [-1, 1]³, основание (низ облака) — y = BASE
const BASE = -0.62, MAXB = 64;
function rng(s) { return () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
// кучевое облако — «цветная капуста»: крупные клубы тела, на их верхней половине — клубы помельче, на тех — ещё мельче
function shape(i) {
  const r = rng(1000 + i * 77), b = [], flat = i >= 12;
  if (!flat) {
    const w = 0.34 + r() * 0.16, tall = r() < 0.35, n = 4 + Math.floor(r() * 3);
    for (let k = 0; k < n; k++) { const x = (k / (n - 1) - 0.5) * 2 * w, rr = 0.24 + r() * 0.12 + (1 - Math.abs(x) / w) * 0.14; b.push([x, BASE + rr * 0.5 + (r() - 0.5) * 0.14, (r() - 0.5) * 0.25, rr]); }
    const m = 2 + Math.floor(r() * 3);
    for (let k = 0; k < m; k++) { const rr = 0.22 + r() * 0.12; b.push([(r() - 0.5) * w * 1.1, BASE + 0.48 + r() * 0.25 + (tall ? 0.22 : 0), (r() - 0.5) * 0.25, rr]); }
    if (tall) { const x = (r() - 0.5) * w * 0.6; b.push([x, BASE + 1.02, 0, 0.22 + r() * 0.05]); b.push([x + (r() - 0.5) * 0.15, BASE + 1.25, 0, 0.15]); }
  } else {
    const n = 7 + Math.floor(r() * 3);
    for (let k = 0; k < n; k++) { const x = (k / (n - 1) - 0.5) * 1.3, rr = 0.16 + r() * 0.1; b.push([x, BASE + rr * 0.6 + r() * 0.06, (r() - 0.5) * 0.45, rr]); }
  }
  // дочерние клубы на верхней половине (и к зрителю/от зрителя), радиус 0,4–0,6 родителя
  for (let gen = 0; gen < 2; gen++) {
    const par = b.filter((q) => q[3] > (gen ? 0.07 : 0.12)).slice();
    for (const q of par) {
      const kids = gen ? 1 + Math.floor(r() * 2) : 2 + Math.floor(r() * 3);
      for (let k = 0; k < kids && b.length < MAXB; k++) {
        const a = r() * Math.PI * 2, el = 0.25 + r() * 0.9; // над экватором клуба
        const dx = Math.cos(a) * Math.cos(el), dy = Math.sin(el), dz = Math.sin(a) * Math.cos(el) * 0.8;
        const rr = q[3] * (0.38 + r() * 0.22), dd = q[3] * (0.82 + r() * 0.15);
        const y = q[1] + dy * dd; if (y - rr < BASE + 0.03) continue;
        b.push([q[0] + dx * dd, y, q[2] + dz * dd, rr]);
      }
    }
  }
  while (b.length < MAXB) b.push([0, 0, 0, -1]);
  return b.slice(0, MAXB);
}
const GLSL = `
uniform vec4 uB[${MAXB}]; uniform float uMode, uSeed, uFlat;
varying vec2 vUv;
float h3(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float vn(vec3 x) { vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(h3(i), h3(i + vec3(1,0,0)), f.x), mix(h3(i + vec3(0,1,0)), h3(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(h3(i + vec3(0,0,1)), h3(i + vec3(1,0,1)), f.x), mix(h3(i + vec3(0,1,1)), h3(i + vec3(1,1,1)), f.x), f.y), f.z); }
float fbm(vec3 p) { float a = 0.5, s = 0.0; for (int i = 0; i < 5; i++) { s += a * vn(p); p = p * 2.03 + 11.7; a *= 0.5; } return s; }
float worley(vec3 p) { vec3 i = floor(p), f = fract(p); float m = 1.0;
  for (int z = -1; z <= 1; z++) for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) { vec3 g = vec3(float(x), float(y), float(z)); vec3 o = vec3(h3(i + g), h3(i + g + 17.1), h3(i + g + 31.7)); m = min(m, length(g + o - f)); }
  return m; }
float field(vec3 p) {
  float f = -1.0;
  for (int i = 0; i < ${MAXB}; i++) { vec4 b = uB[i]; if (b.w > 0.0) { vec3 d = p - b.xyz; d.y *= d.y < 0.0 ? 1.45 : 1.0; f = max(f, b.w - length(d)); } } // снизу клубы приплюснуты, но не срезаны
  vec3 q = p + uSeed * 3.7; float up = smoothstep(${BASE.toFixed(2)}, ${BASE.toFixed(2)} + 0.6, p.y);
  f -= (1.0 - worley(q * 11.0)) * 0.035 * up;                     // мелкие клубочки на верху
  f += (fbm(q * vec3(4.0, 7.0, 4.0)) - 0.5) * mix(0.26, 0.06, up); // низ рыхлый, клочьями; верх чёткий
  f -= smoothstep(0.8, 0.98, max(abs(p.x), abs(p.y))) * 0.6; // к краю клетки облако само сходит на нет
  f -= smoothstep(${BASE.toFixed(2)} + 0.02, ${BASE.toFixed(2)} - 0.2, p.y) * 0.3; // ниже основания — быстро сходит на нет (неровно, по клубам)
  return f;
}
float dens(vec3 p) { float up = smoothstep(${BASE.toFixed(2)}, ${BASE.toFixed(2)} + 0.5, p.y); return smoothstep(mix(-0.06, -0.01, up), mix(0.3, 0.07, up), field(p)); }
// пропускание света к точке со стороны dir (8 шагов), с поправкой на многократное рассеяние — внутри облака не чёрно
float lightT(vec3 p, vec3 dir, float k) { float od = 0.0; for (int j = 1; j <= 10; j++) od += dens(p + dir * float(j) * 0.07); od *= 0.07 * k;
  return exp(-od) * 0.65 + exp(-od * 0.22) * 0.35; }
void main() {
  vec2 c = vUv * 2.0 - 1.0; vec3 ro = vec3(c * 1.0, 1.15);
  float T = 1.0; vec3 sA = vec3(0.0), sB = vec3(0.0);
  const int STEPS = 110; float dt = 2.3 / float(STEPS);
  for (int i = 0; i < STEPS; i++) {
    vec3 p = ro + vec3(0.0, 0.0, -dt * (float(i) + 0.5));
    float d = dens(p); if (d < 0.003) continue;
    float a = 1.0 - exp(-d * dt * 12.0), w = T * a;
    if (w > 0.0015) {
      if (uMode < 0.5 || uMode > 1.5) sA += w * vec3(lightT(p, vec3(1.0, 0.0, 0.0), 9.0), lightT(p, vec3(0.0, 1.0, 0.0), 9.0), lightT(p, vec3(-1.0, 0.0, 0.0), 9.0));
      else sB += w * vec3(0.0, lightT(p, vec3(0.0, 0.0, -1.0), 9.0), lightT(p, normalize(vec3(0.0, 1.0, 0.0)), 2.5) * 0.6 + lightT(p, vec3(0.0, 0.0, 1.0), 2.5) * 0.4);
    }
    T *= 1.0 - a; if (T < 0.01) break;
  }
  float alpha = 1.0 - T, ia = 1.0 / max(alpha, 1e-3);
  alpha *= smoothstep(1.0, 0.94, max(abs(c.x), abs(c.y))); // края клетки — без облака (иначе на стыке в атласе тянется соседнее)
  // свет — средний по видимой толще (делён на прозрачность): тонкий край против солнца — светлый
  if (uMode < 0.5) gl_FragColor = vec4(alpha > 0.002 ? clamp(sA * ia, 0.0, 1.0) : vec3(1.0), 1.0);
  else if (uMode < 1.5) gl_FragColor = vec4(alpha, alpha > 0.002 ? clamp(sB.yz * ia, 0.0, 1.0) : vec2(1.0), 1.0);
  else { // превью: солнце справа сверху
    vec3 l = alpha > 0.002 ? sA * ia : vec3(1.0); float lit = 0.5 * l.x + 0.5 * l.y;
    vec3 col = mix(vec3(0.5, 0.55, 0.63), vec3(1.0), lit); gl_FragColor = vec4(mix(vec3(0.33, 0.5, 0.75), col, alpha), 1.0); }
}`;
const mk = (mode) => {
  const r = new THREE.WebGLRenderer({ preserveDrawingBuffer: true, alpha: false, antialias: false }); r.setPixelRatio(1); r.setSize(S, S, false);
  r.outputEncoding = THREE.LinearEncoding; r.setScissorTest(true); document.body.appendChild(r.domElement);
  const mat = new THREE.ShaderMaterial({ uniforms: { uB: { value: Array.from({ length: MAXB }, () => new THREE.Vector4()) }, uMode: { value: mode }, uSeed: { value: 0 }, uFlat: { value: 0 } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }', fragmentShader: GLSL });
  const sc = new THREE.Scene(), cam = new THREE.Camera(); sc.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));
  for (let i = 0; i < N * N; i++) {
    shape(i).forEach((b, k) => mat.uniforms.uB.value[k].set(...b)); mat.uniforms.uSeed.value = i * 1.37; mat.uniforms.uFlat.value = i >= 12 ? 1 : 0;
    const x = (i % N) * CELL, y = Math.floor(i / N) * CELL; r.setViewport(x, y, CELL, CELL); r.setScissor(x, y, CELL, CELL); r.render(sc, cam);
  }
  return r.domElement;
};
window.__bake = () => { const out = {}; out.n = mk(0).toDataURL('image/png'); out.d = mk(1).toDataURL('image/png'); return out; };
if (Q.get('show')) mk(2);
window.__ok = 1;
</script></body></html>
