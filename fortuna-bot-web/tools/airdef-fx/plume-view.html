<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Стенд шлейфов ракет</title>
<style>body{margin:0;background:#000;overflow:hidden}#i{position:fixed;left:8px;top:6px;color:#fff;font:12px sans-serif;text-shadow:0 0 3px #000}</style></head>
<body><div id="i"></div>
<!-- Стенд шлейфов (games/airdef/plume.js): ракеты разных двигателей летят дугой вверх, камера сбоку. ?t=8 — секунд полёта
     до стоп-кадра (window.__ok), ?sky=dusk — сумерки, ?cam=chase — камера за первой ракетой, ?alt=9000 — пуск на высоте,
     ?wts=0 — без клубов Blender вдоль следа (как было до 2026-11-01), ?close=N — камера вблизи ракеты N (сбоку-снизу, факел и начало следа),
     ?wtf=0 — прежний факел (раскадровка). -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">
import { createPlumes, makeFlame, flameTick, MOTOR, setTrailPuffs, setPuffCam, setIgnition, PUFF_MIN } from '../../games/airdef/plume.js?v=20261111a';
import { makePuffs } from '../../games/airdef/puffs.js?v=20261111a';
const Q = new URLSearchParams(location.search), T = +(Q.get('t') || 8), dusk = Q.get('sky') === 'dusk', ALT = +(Q.get('alt') || 0);
const r = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true }); r.setPixelRatio(1); r.setSize(innerWidth, innerHeight);
r.outputEncoding = THREE.sRGBEncoding; r.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(r.domElement);
const sc = new THREE.Scene(), sky = dusk ? 0x6c6474 : 0x8fb3d9; sc.background = new THREE.Color(sky);
const cam = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 1, 60000);
sc.add(new THREE.HemisphereLight(dusk ? 0x8a7f99 : 0xcfe0f5, 0x6b6250, dusk ? 0.8 : 1.1)); const sun = new THREE.DirectionalLight(dusk ? 0xffb27a : 0xffffff, dusk ? 0.6 : 1.2); sun.position.set(-1, 2, 1); sc.add(sun);
const gnd = new THREE.Mesh(new THREE.PlaneGeometry(60000, 60000).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: dusk ? 0x2a2a20 : 0x4f5a3a })); gnd.position.y = ALT; sc.add(gnd);
const PL = createPlumes(sc, {}); if (Q.get('ribbon') === '0') PL.mesh.visible = false; // ?ribbon=0 — только клубы (проверка)
// клубы следа (как в игре: units-render.js PT) — лист ex_puff; без ?wts=0
let PT = null;
if (Q.get('wts') !== '0') {
  // ?sheet=try — пробный лист клубов следа (trail-try/, trail.py до запекания набело); иначе — лист игры (trail, нет — puff)
  const TRY = Q.get('sheet') === 'try', J = await (await fetch(TRY ? 'trail-try/trail.json' : '../../games/airdef/fx/explode.json?v=20261111a')).json();
  const key = TRY ? 'trail' : J.trail ? 'trail' : 'puff', j = J[key], u = (e) => TRY ? `trail-try/ex_trail.${e}?t=${Date.now()}` : `../../games/airdef/fx/ex_${key}.${e}?v=20261111a`;
  PT = makePuffs(sc, 4000, { url: u('webp'), cols: j.cols, rows: j.rows, frames: j.frames, variants: j.variants, times: j.times, fadeIn: 0.05, sqrtGrow: true, k: key === 'trail' ? (TRY ? 1.3 : 1.7) : 2 }); // клуб следа заполняет клетку — множитель меньше
  PT.mat.uniforms.scale.value = innerHeight / (2 * Math.tan(25 * Math.PI / 180)); setTrailPuffs(PT); setPuffCam(Q.get('cam') === 'chase' ? null : cam); // погоня: камера рядом с ракетой весь полёт — шаг клубов как вблизи
  for (let i = 0; i < 100 && !PT.ready; i++) await new Promise((ok) => setTimeout(ok, 100));
  window.__PT = PT; window.__cam = cam;
  // розжиг — выброс выхлопа назад, как в игре (units-render.js setIgnition; вспышки огня на стенде нет — нет пула огня)
  setIgnition((p, ax, rr, m, k, y) => { if (m.a < PUFF_MIN) return; const n = Math.round(Math.min(14, 3 + rr * 42)), w = Math.max(0.15, rr * m.w), g = (m.g[0] + rr * m.g[1]) * 0.8, life = (m.life[0] + rr * m.life[1]) * 0.45;
    for (let i = 0; i < n; i++) { const sp = (6 + rr * 110) * (0.4 + Math.random() * 0.8), j = sp * 0.35;
      PT.emit(p.x + ax.x * rr * 2, p.y + ax.y * rr * 2, p.z + ax.z * rr * 2, ax.x * sp + (Math.random() - 0.5) * j, ax.y * sp + (Math.random() - 0.5) * j + 0.5, ax.z * sp + (Math.random() - 0.5) * j,
        m.c[0], m.c[1], m.c[2], Math.min(1, m.a * 1.05), w * (1.1 + Math.random() * 0.6), g, life * (0.7 + Math.random() * 0.6), 2.2, 0.15, 0.02); } });
}
// [имя, двигатель старт, маршевый, радиус, длина, разгон м/с², время работы старт, маршевый]
const LIST = [['С-300 (смесевое)', 'solid', null, 0.25, 7.5, 160, 6, 0], ['ПЗРК «Игла»', 'manpads', null, 0.036, 1.6, 300, 2, 0], ['С-75: старт + жидкостный маршевый', 'solid', 'liquid', 0.25, 10.6, 90, 4, 20],
  ['«Куб»: старт + прямоточный', 'solid', 'ramjet', 0.17, 5.8, 120, 3, 15], ['НАР С-8', 'rocket', null, 0.04, 1.6, 500, 0.7, 0], ['ПТУР «Атака»', 'atgm', null, 0.065, 1.8, 200, 3, 0], ['Aster 30 (малодымное)', 'lowsmoke', null, 0.09, 4.9, 260, 4, 0],
  ['Х-29Т (смесевое)', 'solid', null, 0.19, 3.9, 120, 6, 0], ['Lance (жидкостный)', 'liquid', null, 0.28, 6.1, 90, 8, 0]];
const R = LIST.map(([nm, a, b, rad, L, acc, t1, t2], i) => {
  const g = new THREE.Group(), body = new THREE.Mesh(new THREE.CylinderGeometry(rad, rad, L, 12).rotateX(Math.PI / 2), new THREE.MeshLambertMaterial({ color: 0xd8d8d0 })); g.add(body); sc.add(g);
  const fl = makeFlame(g, L / 2, rad, MOTOR[a]), o = {};
  fl.owner = o; // как в игре: пока факел горит, свежий конец следа — в срезе сопла (лента и клубы)
  return { o, nm, a: MOTOR[a], b: b && MOTOR[b], rad, L, acc, t1, t2, g, fl, pos: new THREE.Vector3(i * 260 - 780, ALT + 3, 0), vel: new THREE.Vector3(0, 30, 0), t: 0, tt: 0 };
});
let t = 0; const dt = 1 / 60;
function step() {
  t += dt;
  for (const m of R) {
    const on = m.t < m.t1 + m.t2, boost = m.t < m.t1, mo = boost ? m.a : m.b || m.a;
    const dir = m.vel.clone().normalize(), want = new THREE.Vector3(0.55, 0.85, 0.2).normalize(); dir.lerp(want, Math.min(1, dt * 0.5)).normalize();
    const sp = m.vel.length() + (on ? (boost ? m.acc : m.acc * 0.25) : -20) * dt; m.vel.copy(dir).multiplyScalar(Math.max(30, sp)); m.pos.addScaledVector(m.vel, dt); m.t += dt;
    m.g.position.copy(m.pos); m.g.lookAt(m.pos.clone().sub(dir)); m.fl.motor(mo); m.fl.set(on ? (boost ? 2 : 1) : 0, m.rad, m.pos.y);
    if (on && (m.tt -= dt) <= 0) { m.tt = 0.04; const p = m.pos.clone().addScaledVector(dir, -m.L / 2); PL.add(m.o, p.x, p.y, p.z, mo, m.rad); }
  }
  const LT = new THREE.Vector3(1, 1, 1).multiplyScalar(dusk ? 0.75 : 1.05); flameTick(dt); PL.update(dt, LT); if (PT) PT.update(dt, LT);
}
cam.position.set(0, ALT + +(Q.get('h') || 350), +(Q.get('d') || 1500)); // до полёта: шаг клубов — по расстоянию до камеры
while (t < T) step();
const c0 = R[0].pos;
if (Q.get('cam') === 'launch') { cam.position.set(-900, ALT + 25, 150); cam.lookAt(-780, ALT + 35, 0); } // старт С-300 сбоку: выброс при розжиге
else if (Q.get('close') !== null) { // вблизи: сбоку и чуть снизу, в кадре ракета, факел и начало следа
  const m = R[+Q.get('close')], d = m.vel.clone().normalize(), up = new THREE.Vector3(0, 1, 0), s = new THREE.Vector3().crossVectors(d, up).normalize(), D = Math.max(7, m.L * 2.6), c = m.pos.clone().addScaledVector(d, -m.L * 1.1);
  cam.position.copy(c).addScaledVector(s, D).addScaledVector(up, -D * 0.15); cam.lookAt(c); cam.near = 0.1; cam.updateProjectionMatrix();
  document.getElementById('i').textContent = m.nm + ` · ${T} с`; }
else if (Q.get('cam') === 'chase') { cam.position.copy(c0).add(new THREE.Vector3(-60, -20, 90)); cam.lookAt(c0); }
else { const D = +(Q.get('d') || 1500), H2 = +(Q.get('h') || 350); cam.position.set(0, ALT + H2, D); cam.lookAt(0, ALT + H2, 0); }
if (Q.get('close') === null) document.getElementById('i').textContent = LIST.map((l) => l[0]).join(' · ') + ` · ${T} с`;
if (PT) for (const at of Object.values(PT.points.geometry.attributes)) { at.updateRange.count = -1; at.needsUpdate = true; } // стенд считает полёт без кадров: буферы клубов — целиком (в игре — по кадрам)
setTimeout(() => { r.render(sc, cam); window.__ok = true; }, 2500); // текстуры факела и дыма грузятся
</script></body></html>
