<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Стенд шлейфов ракет</title>
<style>body{margin:0;background:#000;overflow:hidden}#i{position:fixed;left:8px;top:6px;color:#fff;font:12px sans-serif;text-shadow:0 0 3px #000}</style></head>
<body><div id="i"></div>
<!-- Стенд шлейфов (games/airdef/plume.js): ракеты разных двигателей летят дугой вверх, камера сбоку. ?t=8 — секунд полёта
     до стоп-кадра (window.__ok), ?sky=dusk — сумерки, ?cam=chase — камера за первой ракетой, ?alt=9000 — пуск на высоте. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">
import { createPlumes, makeFlame, flameTick, MOTOR } from '../../games/airdef/plume.js?v=20261027a';
const Q = new URLSearchParams(location.search), T = +(Q.get('t') || 8), dusk = Q.get('sky') === 'dusk', ALT = +(Q.get('alt') || 0);
const r = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true }); r.setPixelRatio(1); r.setSize(innerWidth, innerHeight);
r.outputEncoding = THREE.sRGBEncoding; r.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(r.domElement);
const sc = new THREE.Scene(), sky = dusk ? 0x6c6474 : 0x8fb3d9; sc.background = new THREE.Color(sky);
const cam = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 1, 60000);
sc.add(new THREE.HemisphereLight(dusk ? 0x8a7f99 : 0xcfe0f5, 0x6b6250, dusk ? 0.8 : 1.1)); const sun = new THREE.DirectionalLight(dusk ? 0xffb27a : 0xffffff, dusk ? 0.6 : 1.2); sun.position.set(-1, 2, 1); sc.add(sun);
const gnd = new THREE.Mesh(new THREE.PlaneGeometry(60000, 60000).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: dusk ? 0x2a2a20 : 0x4f5a3a })); gnd.position.y = ALT; sc.add(gnd);
const PL = createPlumes(sc, {});
// [имя, двигатель старт, маршевый, радиус, длина, разгон м/с², время работы старт, маршевый]
const LIST = [['С-300 (смесевое)', 'solid', null, 0.25, 7.5, 160, 6, 0], ['ПЗРК «Игла»', 'manpads', null, 0.036, 1.6, 300, 2, 0], ['С-75: старт + жидкостный маршевый', 'solid', 'liquid', 0.25, 10.6, 90, 4, 20],
  ['«Куб»: старт + прямоточный', 'solid', 'ramjet', 0.17, 5.8, 120, 3, 15], ['НАР С-8', 'rocket', null, 0.04, 1.6, 500, 0.7, 0], ['ПТУР «Атака»', 'atgm', null, 0.065, 1.8, 200, 3, 0], ['Aster 30 (малодымное)', 'lowsmoke', null, 0.09, 4.9, 260, 4, 0]];
const R = LIST.map(([nm, a, b, rad, L, acc, t1, t2], i) => {
  const g = new THREE.Group(), body = new THREE.Mesh(new THREE.CylinderGeometry(rad, rad, L, 12).rotateX(Math.PI / 2), new THREE.MeshLambertMaterial({ color: 0xd8d8d0 })); g.add(body); sc.add(g);
  const fl = makeFlame(g, L / 2, rad, MOTOR[a]);
  return { nm, a: MOTOR[a], b: b && MOTOR[b], rad, L, acc, t1, t2, g, fl, pos: new THREE.Vector3(i * 260 - 780, ALT + 3, 0), vel: new THREE.Vector3(0, 30, 0), t: 0, tt: 0 };
});
let t = 0; const dt = 1 / 60;
function step() {
  t += dt;
  for (const m of R) {
    const on = m.t < m.t1 + m.t2, boost = m.t < m.t1, mo = boost ? m.a : m.b || m.a;
    const dir = m.vel.clone().normalize(), want = new THREE.Vector3(0.55, 0.85, 0.2).normalize(); dir.lerp(want, Math.min(1, dt * 0.5)).normalize();
    const sp = m.vel.length() + (on ? (boost ? m.acc : m.acc * 0.25) : -20) * dt; m.vel.copy(dir).multiplyScalar(Math.max(30, sp)); m.pos.addScaledVector(m.vel, dt); m.t += dt;
    m.g.position.copy(m.pos); m.g.lookAt(m.pos.clone().sub(dir)); m.fl.motor(mo); m.fl.set(on ? (boost ? 2 : 1) : 0, m.rad, m.pos.y);
    if (on && (m.tt -= dt) <= 0) { m.tt = 0.04; const p = m.pos.clone().addScaledVector(dir, -m.L / 2); PL.add(m, p.x, p.y, p.z, mo, m.rad); }
  }
  flameTick(dt); PL.update(dt, new THREE.Vector3(1, 1, 1).multiplyScalar(dusk ? 0.75 : 1.05));
}
while (t < T) step();
const c0 = R[0].pos;
if (Q.get('cam') === 'chase') { cam.position.copy(c0).add(new THREE.Vector3(-60, -20, 90)); cam.lookAt(c0); }
else { const D = +(Q.get('d') || 1500), H2 = +(Q.get('h') || 350); cam.position.set(0, ALT + H2, D); cam.lookAt(0, ALT + H2, 0); }
document.getElementById('i').textContent = LIST.map((l) => l[0]).join(' · ') + ` · ${T} с`;
setTimeout(() => { r.render(sc, cam); window.__ok = true; }, 2500); // текстуры факела и дыма грузятся
</script></body></html>
