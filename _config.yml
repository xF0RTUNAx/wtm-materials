# GitHub Pages: модели «Воздушного превосходства» лежат в Cloudflare R2 (assets.fortunawtm.com), на сайт их не публикуем:
# у Pages лимит 1 ГБ на сайт, с моделями было 1,28 ГБ. Закачка в R2: fortuna-bot-web/tools/airdef-models/r2-sync.js
# «Симулятор Летки» (games/drone) брал модели из этой же папки; он условно отключён (Mark 2026-11-05), на Pages для него ничего не держим.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - fortuna-bot-web/games/airdef/models/*.glb
  - fortuna-bot-web/games/airdef/models/ktx
  - fortuna-bot-web/games/airdef/models/camo
include:
  - .htaccess
